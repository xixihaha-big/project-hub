        function parseMinutes() {
            const projectId = document.getElementById('minutesProject').value;
            const meetingId = document.getElementById('minutesMeeting').value;
            const newMeetingName = document.getElementById('minutesNewMeeting').value.trim();
            const date = document.getElementById('minutesDate').value;
            const content = document.getElementById('minutesContent').value.trim();

            if (!projectId) { showToast('请选择所属项目'); return; }
            if (!meetingId && !newMeetingName) { showToast('请选择或输入会议主题'); return; }
            if (!date) { showToast('请选择会议日期'); return; }
            if (!content) { showToast('请粘贴会议纪要内容'); return; }

            // Parse the content - enhanced for Feishu meeting minutes format
            extractedOPLs = [];
            extractedRisks = [];

            // ===== Extract attendees (参会人员) from content =====
            extractedAttendees = '';
            const attendeesPatterns = [
                /参会人员[：:]\s*(.+)/,
                /参会人[：:]\s*(.+)/,
                /与会人员[：:]\s*(.+)/,
                /出席[：:]\s*(.+)/
            ];
            for (const pat of attendeesPatterns) {
                const m = content.match(pat);
                if (m) {
                    let raw = m[1];
                    const citeNames = [];
                    const citeRegex = /user-name="([^"]+)"/g;
                    let cm;
                    while ((cm = citeRegex.exec(raw)) !== null) {
                        citeNames.push(cm[1]);
                    }
                    raw = raw.replace(/<cite[^>]*><\/cite>/g, '').replace(/<[^>]+>/g, '');
                    const plainNames = raw.split(/[,，、\s]+/).map(n => n.replace(/\(外部\)|\（外部\）/g, '').trim()).filter(n => n && n.length >= 2 && n.length <= 10 && !/^\d/.test(n) && !/其他/.test(n) && !/名外部/.test(n));
                    extractedAttendees = [...citeNames, ...plainNames].filter((v, i, a) => a.indexOf(v) === i).join(', ');
                    break;
                }
            }

            const lines = content.split('\n');

            // ===== Multi-strategy parsing for Feishu meeting minutes =====
            // Strategy: identify sections by headings or keywords, then extract items

            let currentSection = '';
            let todoSection = false;
            let riskSection = false;
            let consensusSection = false;
            let summarySection = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // --- Section detection (supports multiple formats) ---
                // Format 1: Markdown headings: # 标题, ## 标题
                // Format 2: Bold text as heading: **标题**
                // Format 3: Emoji + text as heading (common when copying from Feishu): ✅ 待办任务, 🧾 核心议题
                // Format 4: Plain text section headers: "待办任务与跟进", "核心议题"
                const isHeading = /^#{1,3}\s/.test(line) || /^\*\*[^*]+\*\*$/.test(line);
                const isSectionLike = /^[🎉🧾✅🪜📋⚠️🔥💡📌]\s*/.test(line) ||
                    /^(待办|任务|跟进|风险|核心议题|落地策略|总结|共识|补充)/.test(line);

                if (isHeading || isSectionLike) {
                    const headingText = line.replace(/^#{1,3}\s*/, '').replace(/\*\*/g, '').replace(/^[🎉🧾✅🪜📋⚠️🔥💡📌]\s*/, '').trim();
                    todoSection = /待办|任务|跟进|Action|TODO|行动项/.test(headingText);
                    riskSection = /风险|Risk/.test(headingText) && !/应对|处理|策略/.test(headingText);
                    consensusSection = /共识|决议|结论|策略|落地/.test(headingText);
                    summarySection = /总结|概述/.test(headingText);
                    currentSection = headingText;
                    continue;
                }

                // --- Extract TODO/OPL items ---

                // Pattern 1: Markdown checkbox: "- [ ] content @person"
                const checkboxMatch = line.match(/^[-*]\s*\[[\sx]*\]\s*(.+)/);
                if (checkboxMatch) {
                    const parsed = parseItemContent(checkboxMatch[1], 'opl');
                    if (parsed) extractedOPLs.push(parsed);
                    continue;
                }

                // Pattern 2: Plain text todo item (Feishu copy-paste format)
                // When copied from Feishu, "- [ ] xxx" often becomes just "xxx" or "· xxx" or plain text with @
                // Detect: lines containing @person AND in/after todo section, OR lines with task-like patterns
                if (todoSection) {
                    // Strip bullet markers if any
                    let itemText = line.replace(/^[-*•·]\s*/, '').replace(/^\d+[.、)]\s*/, '').trim();
                    // Skip sub-headings and short lines
                    if (itemText.length > 5 && !isHeading && !/^[>]/.test(line)) {
                        // Skip lines that are clearly notes/hints (like "待办任务由 AI 生成")
                        if (!/由.*生成|可能不准确|人工调整/.test(itemText)) {
                            const parsed = parseItemContent(itemText, 'opl');
                            if (parsed) extractedOPLs.push(parsed);
                        }
                    }
                    continue;
                }

                // Pattern 3: Lines with explicit task format anywhere in the doc
                if (/^(问题[:：]|Issue[:：]|待解决[:：]|Action\s*Item[:：]|TODO[:：])/i.test(line)) {
                    const itemText = line.replace(/^(问题[:：]|Issue[:：]|待解决[:：]|Action\s*Item[:：]|TODO[:：])/i, '').trim();
                    if (itemText.length > 3) {
                        const parsed = parseItemContent(itemText, 'opl');
                        if (parsed) extractedOPLs.push(parsed);
                    }
                    continue;
                }

                // --- Extract Risk items ---

                // Pattern 1: Explicit risk prefix
                if (/^(风险[:：]|Risk[:：])/i.test(line)) {
                    const itemText = line.replace(/^(风险[:：]|Risk[:：])/i, '').trim();
                    if (itemText.length > 3) {
                        const parsed = parseItemContent(itemText, 'risk');
                        if (parsed) extractedRisks.push(parsed);
                    }
                    continue;
                }

                // Pattern 2: Inside risk section
                if (riskSection) {
                    let itemText = line.replace(/^[-*•·]\s*/, '').replace(/^\d+[.、)]\s*/, '').trim();
                    if (itemText.length > 5 && !isHeading) {
                        const parsed = parseItemContent(itemText, 'risk');
                        if (parsed) extractedRisks.push(parsed);
                    }
                    continue;
                }

                // Pattern 3: Risk keywords in consensus/strategy sections
                if ((consensusSection || summarySection) && !todoSection) {
                    const strongRiskPatterns = [
                        /存在.*风险/,
                        /风险[较很]?[高大]/,
                        /可能[导造]成/,
                        /延期风险/,
                        /供应.*风险/,
                        /短缺/,
                        /无法按时/,
                        /不能满足/,
                        /冲突/,
                        /抛料/
                    ];
                    const isStrongRisk = strongRiskPatterns.some(p => p.test(line));
                    if (isStrongRisk && line.length > 10 && line.length < 200) {
                        const cleanLine = line.replace(/^[-*•·\d.、)]\s*/, '').replace(/\*\*/g, '').trim();
                        const isDup = extractedRisks.some(r => r.desc.includes(cleanLine.substring(0, 15)) || cleanLine.includes(r.desc.substring(0, 15)));
                        if (!isDup) {
                            const parsed = parseItemContent(cleanLine, 'risk');
                            if (parsed) extractedRisks.push(parsed);
                        }
                    }
                }
            }

            // ===== Strategy 2: If structure-based found nothing, use broader keyword scan =====
            if (extractedOPLs.length === 0 && extractedRisks.length === 0) {
                // Try to find any lines with @ mentions (likely action items)
                const atLines = [];
                const riskLines = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line || line.length < 8 || line.length > 300) continue;
                    if (/^#{1,3}\s/.test(line) || /^>/.test(line)) continue;

                    // Lines with @person are likely action items
                    if (/@[一-龥]{2,4}/.test(line)) {
                        const cleanLine = line.replace(/^[-*•·\d.、)\[\]x\s]*/, '').trim();
                        if (cleanLine.length > 5) atLines.push(cleanLine);
                        continue;
                    }

                    // Keyword-based detection
                    const oplKws = ['需要解决', '待确认', '待解决', '需跟进', '缺失', '缺少', '未完成', '未提供', '催促', '催办', '需尽快', '推动', '协助'];
                    const riskKws = ['风险', '延期', '不确定', '短缺', '冲突', '无法到位', '无法按时', '抛料', '不满足'];

                    const hasOPL = oplKws.some(kw => line.includes(kw));
                    const hasRisk = riskKws.some(kw => line.includes(kw));

                    if (hasRisk && !hasOPL) {
                        const cleanLine = line.replace(/^[-*•·\d.、)]\s*/, '').replace(/\*\*/g, '').trim();
                        if (cleanLine.length > 5) riskLines.push(cleanLine);
                    } else if (hasOPL) {
                        const cleanLine = line.replace(/^[-*•·\d.、)]\s*/, '').replace(/\*\*/g, '').trim();
                        if (cleanLine.length > 5) atLines.push(cleanLine);
                    }
                }

                // Parse collected lines
                atLines.forEach(line => {
                    const isDup = extractedOPLs.some(r => r.desc.includes(line.substring(0, 15)));
                    if (!isDup) {
                        const parsed = parseItemContent(line, 'opl');
                        if (parsed) extractedOPLs.push(parsed);
                    }
                });
                riskLines.forEach(line => {
                    const isDup = extractedRisks.some(r => r.desc.includes(line.substring(0, 15)));
                    if (!isDup) {
                        const parsed = parseItemContent(line, 'risk');
                        if (parsed) extractedRisks.push(parsed);
                    }
                });
            }

            // ===== Strategy 3: Extract risks from "会议共识" numbered items =====
            // Feishu meeting notes often have risks embedded in consensus points
            if (extractedRisks.length === 0) {
                let inConsensus = false;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (/共识|风险.*应对|风险.*处理/.test(line) && (line.length < 30 || /^[#*]/.test(line))) {
                        inConsensus = true;
                        continue;
                    }
                    if (inConsensus && /^[#]/.test(line)) { inConsensus = false; continue; }
                    if (inConsensus && /风险|延期|冲突|无法/.test(line) && line.length > 10 && line.length < 200) {
                        const cleanLine = line.replace(/^[-*•·\d.、)]\s*/, '').replace(/\*\*/g, '').trim();
                        const isDup = extractedRisks.some(r => r.desc.includes(cleanLine.substring(0, 15)));
                        if (!isDup) {
                            const parsed = parseItemContent(cleanLine, 'risk');
                            if (parsed) extractedRisks.push(parsed);
                        }
                    }
                }
            }

            // Show step 2 with results
            if (extractedOPLs.length === 0 && extractedRisks.length === 0) {
                showToast('未能从会议纪要中识别到问题项或风险项，请检查内容格式');
                return;
            }
            renderParsedResults();
            document.getElementById('minutesStep1').classList.remove('active');
            document.getElementById('minutesStep2').classList.add('active');
        }

        // Helper: parse a single item line and extract owner, date, priority, category
        function parseItemContent(text, type) {
            let desc = text.trim();
            if (!desc || desc.length < 3) return null;

            // Remove markdown bold markers and cite tags
            desc = desc.replace(/\*\*/g, '');
            desc = desc.replace(/<cite[^>]*user-name="([^"]+)"[^>]*><\/cite>/g, '@$1');
            desc = desc.replace(/<[^>]+>/g, '');

            // Extract owner: @name patterns (support multiple @mentions, take first as owner)
            let owner = '';
            const ownerPatterns = [
                /@([一-龥]{2,4})/,
                /@([^\s@,，;；。.\d]{2,10})/,
                /负责人[:：]\s*([^\s,，;；。.]+)/,
                /责任人[:：]\s*([^\s,，;；。.]+)/
            ];
            for (const pat of ownerPatterns) {
                const m = desc.match(pat);
                if (m) {
                    owner = m[1];
                    // Remove all @mentions from description
                    desc = desc.replace(/@[一-龥]{2,4}/g, '').replace(/@[^\s@,，;；。.\d]{2,10}/g, '').trim();
                    break;
                }
            }

            // Extract due date
            let dueDate = '';
            const datePatterns = [
                { re: /截止[:：]?\s*(\d{4}-\d{2}-\d{2})/, idx: 1, full: true },
                { re: /(\d{4}-\d{2}-\d{2})/, idx: 1, full: true },
                { re: /(\d{1,2})月(\d{1,2})[日号]前?/, idx: null, full: false },
                { re: /本周([一二三四五六日天])前?/, idx: null, full: false }
            ];
            for (const dp of datePatterns) {
                const m = desc.match(dp.re);
                if (m) {
                    if (dp.full) {
                        dueDate = m[dp.idx];
                    } else if (m[1] && m[2]) {
                        const year = new Date().getFullYear();
                        dueDate = `${year}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
                    }
                    desc = desc.replace(m[0], '').trim();
                    break;
                }
            }

            // Extract priority
            let priority = 'Medium';
            if (/紧急|重要|高优先|尽快|立即/.test(text)) priority = 'High';
            else if (/低优先|不紧急|适时/.test(text)) priority = 'Low';

            // Extract category
            let category = 'Other';
            if (type === 'opl') {
                if (/设计|Design|BOM|原理图/i.test(text)) category = 'Design';
                else if (/工艺|Process|工装|治具|插件|贴片|焊接/i.test(text)) category = 'Process';
                else if (/材料|Material|物料|备料|来料|导热垫|电容/i.test(text)) category = 'Material';
                else if (/质量|Quality|AECQ|PPAP|合格/i.test(text)) category = 'Quality';
                else if (/测试|Test|验证|DVP|DV/i.test(text)) category = 'Test';
                else if (/生产|Production|排产|量产|产线/i.test(text)) category = 'Production';
                else if (/供应|供应商|采购|交付/i.test(text)) category = 'Supply Chain';
            } else {
                if (/技术|Technical|设计缺陷/i.test(text)) category = 'Technical';
                else if (/进度|Schedule|延期|延迟|时间.*冲突|无法按时/i.test(text)) category = 'Schedule';
                else if (/质量|Quality|良率|不良/i.test(text)) category = 'Quality';
                else if (/供应|Supply|供应商|短缺|缺料|备料/i.test(text)) category = 'Supply Chain';
                else if (/成本|Cost|费用|预算/i.test(text)) category = 'Cost';
                else if (/资源|Resource|人力/i.test(text)) category = 'Resource';
                else if (/工艺|Process|工装|治具|抛料/i.test(text)) category = 'Technical';
            }

            // Clean up description
            desc = desc.replace(/[,，;；。]\s*$/, '').replace(/^\s*[:：]\s*/, '').trim();
            // Remove trailing periods and extra spaces
            desc = desc.replace(/\s{2,}/g, ' ').replace(/[。.]\s*$/, '').trim();
            if (!desc || desc.length < 3) return null;

            if (type === 'opl') {
                return { desc, owner, dueDate, priority, category };
            } else {
                return { desc, owner, dueDate, level: priority, category };
            }
        }

        function renderParsedResults() {
            let html = '';

            // OPL section
            html += `<div class="parsed-section-title">问题项 (OPL) <span class="count-badge">${extractedOPLs.length} 项</span></div>`;
            if (extractedOPLs.length === 0) {
                html += '<div style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">未识别到问题项</div>';
            } else {
                extractedOPLs.forEach((item, idx) => {
                    html += `
                    <div class="extracted-card" id="opl-card-${idx}">
                        <button class="ec-remove" onclick="removeExtractedItem('opl', ${idx})" title="移除">&times;</button>
                        <div class="ec-desc">
                            <input type="text" value="${escapeHtml(item.desc)}" onchange="extractedOPLs[${idx}].desc=this.value" style="width:100%; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:13px; font-weight:500;">
                        </div>
                        <div class="ec-fields">
                            <div class="ec-field">
                                <label>负责人</label>
                                <input type="text" value="${escapeHtml(item.owner)}" onchange="extractedOPLs[${idx}].owner=this.value" placeholder="未指定">
                            </div>
                            <div class="ec-field">
                                <label>截止日期</label>
                                <input type="date" value="${item.dueDate}" onchange="extractedOPLs[${idx}].dueDate=this.value">
                            </div>
                            <div class="ec-field">
                                <label>优先级</label>
                                <select onchange="extractedOPLs[${idx}].priority=this.value">
                                    <option value="High" ${item.priority==='High'?'selected':''}>高</option>
                                    <option value="Medium" ${item.priority==='Medium'?'selected':''}>中</option>
                                    <option value="Low" ${item.priority==='Low'?'selected':''}>低</option>
                                </select>
                            </div>
                            <div class="ec-field">
                                <label>类别</label>
                                <select onchange="extractedOPLs[${idx}].category=this.value">
                                    <option value="Design" ${item.category==='Design'?'selected':''}>设计</option>
                                    <option value="Process" ${item.category==='Process'?'selected':''}>工艺</option>
                                    <option value="Material" ${item.category==='Material'?'selected':''}>材料</option>
                                    <option value="Quality" ${item.category==='Quality'?'selected':''}>质量</option>
                                    <option value="Test" ${item.category==='Test'?'selected':''}>测试</option>
                                    <option value="Production" ${item.category==='Production'?'selected':''}>生产</option>
                                    <option value="Other" ${item.category==='Other'?'selected':''}>其他</option>
                                </select>
                            </div>
                        </div>
                    </div>`;
                });
            }

            // Risk section
            html += `<div class="parsed-section-title" style="margin-top:20px;">风险项 (Risk) <span class="count-badge">${extractedRisks.length} 项</span></div>`;
            if (extractedRisks.length === 0) {
                html += '<div style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">未识别到风险项</div>';
            } else {
                extractedRisks.forEach((item, idx) => {
                    html += `
                    <div class="extracted-card" id="risk-card-${idx}">
                        <button class="ec-remove" onclick="removeExtractedItem('risk', ${idx})" title="移除">&times;</button>
                        <div class="ec-desc">
                            <input type="text" value="${escapeHtml(item.desc)}" onchange="extractedRisks[${idx}].desc=this.value" style="width:100%; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:13px; font-weight:500;">
                        </div>
                        <div class="ec-fields">
                            <div class="ec-field">
                                <label>负责人</label>
                                <input type="text" value="${escapeHtml(item.owner)}" onchange="extractedRisks[${idx}].owner=this.value" placeholder="未指定">
                            </div>
                            <div class="ec-field">
                                <label>截止日期</label>
                                <input type="date" value="${item.dueDate}" onchange="extractedRisks[${idx}].dueDate=this.value">
                            </div>
                            <div class="ec-field">
                                <label>风险级别</label>
                                <select onchange="extractedRisks[${idx}].level=this.value">
                                    <option value="High" ${item.level==='High'?'selected':''}>高</option>
                                    <option value="Medium" ${item.level==='Medium'?'selected':''}>中</option>
                                    <option value="Low" ${item.level==='Low'?'selected':''}>低</option>
                                </select>
                            </div>
                            <div class="ec-field">
                                <label>类别</label>
                                <select onchange="extractedRisks[${idx}].category=this.value">
                                    <option value="Technical" ${item.category==='Technical'?'selected':''}>技术</option>
                                    <option value="Schedule" ${item.category==='Schedule'?'selected':''}>进度</option>
                                    <option value="Quality" ${item.category==='Quality'?'selected':''}>质量</option>
                                    <option value="Supply Chain" ${item.category==='Supply Chain'?'selected':''}>供应链</option>
                                    <option value="Cost" ${item.category==='Cost'?'selected':''}>成本</option>
                                    <option value="Resource" ${item.category==='Resource'?'selected':''}>资源</option>
                                    <option value="Other" ${item.category==='Other'?'selected':''}>其他</option>
                                </select>
                            </div>
                        </div>
                    </div>`;
                });
            }

            if (extractedOPLs.length === 0 && extractedRisks.length === 0) {
                html += '<div style="text-align:center; padding:20px; color:var(--text-muted);">未能从文本中识别出问题项或风险项。<br>请检查内容格式或返回修改。</div>';
            }

            document.getElementById('parsedResults').innerHTML = html;
        }

        function removeExtractedItem(type, index) {
            if (type === 'opl') {
                extractedOPLs.splice(index, 1);
            } else {
                extractedRisks.splice(index, 1);
            }
            renderParsedResults();
        }

        function backToMinutesInput() {
            document.getElementById('minutesStep2').classList.remove('active');
            document.getElementById('minutesStep1').classList.add('active');
        }

        function confirmMinutesImport() {
            const projectId = document.getElementById('minutesProject').value;
            let meetingId = document.getElementById('minutesMeeting').value;
            const newMeetingName = document.getElementById('minutesNewMeeting').value.trim();
            const date = document.getElementById('minutesDate').value;
            const content = document.getElementById('minutesContent').value.trim();

            // If new meeting name provided, create the meeting first
            if (!meetingId && newMeetingName) {
                meetingId = 'M' + String(store.meetings.length + 1).padStart(3, '0');
                store.meetings.push({
                    id: meetingId,
                    name: newMeetingName,
                    projectId: projectId,
                    docUrl: '',
                    depts: [],
                    frequency: 'adhoc',
                    createdAt: new Date().toISOString().split('T')[0],
                    followups: []
                });
                addActivity(`创建了会议主题：${newMeetingName}`, 'meeting', projectId);
            }

            if (!meetingId) { showToast('请选择或创建会议主题'); return; }

            let oplCount = 0;
            let riskCount = 0;

            // Add OPL items
            extractedOPLs.forEach(item => {
                if (!item.desc) return;
                const id = 'OPL-' + String(store.opls.length + 1).padStart(3, '0');
                store.opls.push({
                    id,
                    desc: item.desc,
                    projectId,
                    category: item.category || 'Other',
                    owner: item.owner || '待指定',
                    dueDate: item.dueDate || '',
                    priority: item.priority || 'Medium',
                    status: 'Open',
                    action: '',
                    result: '',
                    createdAt: new Date().toISOString().split('T')[0]
                });
                oplCount++;
            });

            // Add Risk items
            extractedRisks.forEach(item => {
                if (!item.desc) return;
                const id = 'RISK-' + String(store.risks.length + 1).padStart(3, '0');
                store.risks.push({
                    id,
                    desc: item.desc,
                    projectId,
                    category: item.category || 'Other',
                    level: item.level || 'Medium',
                    owner: item.owner || '待指定',
                    dueDate: item.dueDate || '',
                    status: 'Open',
                    mitigation: '',
                    createdAt: new Date().toISOString().split('T')[0]
                });
                riskCount++;
            });

            // Add meeting minutes as followup
            const meeting = store.meetings.find(m => m.id === meetingId);
            if (meeting) {
                const fid = 'F' + String(Date.now()).slice(-6);
                meeting.followups.unshift({
                    id: fid,
                    date: date,
                    notes: content.substring(0, 500) + (content.length > 500 ? '...' : ''),
                    attendees: extractedAttendees || ''
                });
            }

            // Activity logs
            if (oplCount > 0) {
                addActivity(`从会议纪要导入了 ${oplCount} 个问题项`, 'opl', projectId);
            }
            if (riskCount > 0) {
                addActivity(`从会议纪要导入了 ${riskCount} 个风险项`, 'risk', projectId);
            }
            addActivity(`上传了会议纪要（${date}）`, 'meeting', projectId);

            saveStore();
            closeModal('minutesUpload');

            const totalItems = oplCount + riskCount;
            showToast(`导入成功！添加了 ${oplCount} 个问题项和 ${riskCount} 个风险项`);

            // Refresh current page
            if (currentPage === 'dashboard') renderDashboard();
            else if (currentPage === 'meetings') renderMeetings();
            else if (currentPage === 'opl') renderOPL();
            else if (currentPage === 'risk') renderRisk();
            updateCounts();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML.replace(/"/g, '&quot;');
        }

        // Close modals on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('active');
            });
        });

        // ==================== Init ====================
        loadStore();
        renderDashboard();
    </script>
</body>
</html>
