<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理跟踪面板</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #6366f1;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-layout { display: flex; min-height: 100vh; }

        
        .project-selector select { outline: none; }
        .project-selector select:focus { border-color: var(--primary); }
        .project-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 6px; margin-bottom: 4px; background: var(--border-light); }
        .project-item .pi-name { font-weight: 500; font-size: 14px; }
        .project-item .pi-desc { font-size: 12px; color: var(--text-muted); }
        .project-item .pi-actions { display: flex; gap: 4px; }
        .project-item.current { border: 2px solid var(--primary); background: var(--primary-light); }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #1e293b;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
        }

        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header .logo {
            width: 32px; height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }

        .sidebar-nav { flex: 1; padding: 12px; }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 8px;
            cursor: pointer; font-size: 14px;
            transition: all 0.15s; color: #cbd5e1;
            margin-bottom: 4px;
        }

        .nav-item:hover { background: #334155; color: #fff; }
        .nav-item.active { background: var(--primary); color: #fff; font-weight: 500; }
        .nav-item .icon { width: 20px; text-align: center; font-size: 15px; }
        .nav-item .badge-count {
            margin-left: auto;
            background: rgba(255,255,255,0.15);
            padding: 1px 7px; border-radius: 10px; font-size: 11px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #334155;
            font-size: 12px; color: #64748b;
        }

        /* Main Content */
        .main-content { flex: 1; margin-left: 240px; display: flex; flex-direction: column; }

        .topbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }

        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .topbar-left h2 { font-size: 18px; font-weight: 600; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }

        .page-content { padding: 24px 32px; flex: 1; }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between;
        }

        .card-title { font-size: 15px; font-weight: 600; }
        .card-body { padding: 20px; }

        /* Buttons */
        .btn {
            padding: 8px 16px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card-bg);
            cursor: pointer; font-size: 13px; font-weight: 500;
            transition: all 0.15s;
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text);
        }

        .btn:hover { border-color: var(--primary); color: var(--primary); }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
        .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
        .btn-success:hover { opacity: 0.9; color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-danger:hover { opacity: 0.9; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-ghost { border: none; background: none; color: var(--text-secondary); }
        .btn-ghost:hover { color: var(--primary); background: var(--primary-light); }

        /* Badges */
        .badge {
            padding: 3px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 600;
            display: inline-block;
        }

        .badge-high, .badge-danger { background: var(--danger-light); color: var(--danger); }
        .badge-medium, .badge-warning { background: var(--warning-light); color: #b45309; }
        .badge-low, .badge-info { background: var(--info-light); color: var(--info); }
        .badge-open { background: var(--warning-light); color: #b45309; }
        .badge-inprogress { background: var(--info-light); color: var(--info); }
        .badge-closed { background: var(--success-light); color: #047857; }
        .badge-overdue { background: var(--danger-light); color: var(--danger); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px; margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .stat-card.warning { border-left: 4px solid var(--warning); }
        .stat-card.danger { border-left: 4px solid var(--danger); }
        .stat-card.success { border-left: 4px solid var(--success); }
        .stat-card.info { border-left: 4px solid var(--info); }

        .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-detail { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        /* Tables */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; background: #f8fafc; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border); font-size: 12px; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
        tr:hover td { background: #f8fafc; }

        .owner-tag {
            background: var(--primary-light); color: var(--primary);
            padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;
        }

        /* Filter bar */
        .filter-bar {
            display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            padding: 7px 12px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 13px;
            background: var(--card-bg);
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px; width: 90%; max-width: 520px;
            max-height: 85vh; overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-wide { max-width: 750px; }

        .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 13px; font-family: inherit;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }

        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-light); }

        /* Evidence rows */
        .evidence-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; padding: 8px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); background: #fafbfc; }
        .evidence-row .ev-left { flex: 1; min-width: 0; }
        .evidence-row .ev-left input { width: 100%; padding: 6px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 4px; }
        .evidence-row .ev-left input:last-child { margin-bottom: 0; }
        .evidence-row .ev-right { display: flex; flex-direction: column; gap: 4px; align-items: center; flex-shrink: 0; }
        .evidence-row .ev-preview { width: 80px; height: 60px; border-radius: 4px; object-fit: cover; border: 1px solid var(--border); background: #fff; cursor: pointer; }
        .evidence-row .ev-preview-placeholder { width: 80px; height: 60px; border-radius: 4px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); background: #fff; }
        .evidence-row .ev-file-upload { display: flex; gap: 4px; }
        .evidence-row .btn-upload { font-size: 11px; padding: 4px 8px; cursor: pointer; background: var(--primary-light); color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; white-space: nowrap; }
        .evidence-row .btn-upload:hover { background: var(--primary); color: #fff; }
        .evidence-row .btn-remove { color: var(--danger); font-size: 11px; padding: 4px 8px; cursor: pointer; background: none; border: 1px solid var(--danger); border-radius: 4px; white-space: nowrap; }
        .evidence-row .btn-remove:hover { background: var(--danger); color: #fff; }
        .evidence-row .ev-file-info { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .evidence-cell { max-width: 120px; }
        .evidence-cell .ev-thumbs { display: flex; gap: 2px; flex-wrap: wrap; }
        .evidence-cell .ev-thumb { width: 36px; height: 28px; border-radius: 3px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
        .evidence-cell .ev-file-icon { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--text-secondary); margin-right: 4px; }
        .evidence-cell .ev-download { color: var(--primary); cursor: pointer; font-size: 11px; text-decoration: underline; }
        /* Evidence lightbox */
        .ev-lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .ev-lightbox img { max-width: 90%; max-height: 90%; border-radius: 4px; }
        .evidence-cell { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
        .evidence-cell a { color: var(--primary); text-decoration: none; }
        .evidence-cell a:hover { text-decoration: underline; }
        .note-cell { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-secondary); }

        /* Meeting cards */
        .meeting-list-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .meeting-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 16px; cursor: pointer;
            transition: all 0.15s;
        }

        .meeting-card:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); }
        .meeting-card .mc-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .meeting-card .mc-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; }
        .meeting-card .mc-followups { font-size: 12px; color: var(--primary); margin-top: 8px; }

        /* Meeting detail */
        .meeting-detail-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
        }

        .followup-timeline { }
        .followup-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .followup-item:last-child { border-bottom: none; }
        .fi-date { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .fi-notes { font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
        .fi-attendees { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: #1e293b; color: #fff;
            padding: 12px 20px; border-radius: 8px;
            font-size: 13px; z-index: 9999;
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }

        /* Empty State */
        .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
        .empty-state .es-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .empty-state .es-title { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .empty-state .es-desc { font-size: 13px; }

        /* Minutes textarea */
        .minutes-textarea { min-height: 200px; font-size: 13px; line-height: 1.7; }

        .parsed-section-title {
            font-size: 14px; font-weight: 600; margin-bottom: 10px;
            padding-bottom: 6px; border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; gap: 8px;
        }

        .parsed-section-title .count-badge {
            background: var(--primary-light); color: var(--primary);
            padding: 2px 8px; border-radius: 10px; font-size: 11px;
        }

        .extracted-card {
            background: #f8fafc; border: 1px solid var(--border-light);
            border-radius: var(--radius-sm); padding: 12px 14px;
            margin-bottom: 10px; position: relative;
        }

        .extracted-card .ec-desc { font-size: 13px; font-weight: 500; margin-bottom: 8px; padding-right: 30px; }
        .extracted-card .ec-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .extracted-card .ec-fields .ec-field { display: flex; flex-direction: column; gap: 3px; }
        .extracted-card .ec-fields .ec-field label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .extracted-card .ec-fields .ec-field input,
        .extracted-card .ec-fields .ec-field select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; background: #fff; }

        .extracted-card .ec-remove {
            position: absolute; top: 10px; right: 10px;
            background: none; border: none; color: var(--danger);
            cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px;
        }
        .extracted-card .ec-remove:hover { background: var(--danger-light); }

        .minutes-step { display: none; }
        .minutes-step.active { display: block; }

        .parse-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

        /* Minutes record display */
        .minutes-content-box {
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .page-content { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><span class="logo">P</span> 项目管理</h1>
            </div>
            <div class="project-selector" style="padding: 12px 16px; border-bottom: 1px solid #334155;">
                <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">当前项目</label>
                <select id="projectSelect" onchange="switchProject(this.value)" style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid #475569; background:#334155; color:#e2e8f0; font-size:13px; cursor:pointer;">
                </select>
                <button class="btn btn-sm" onclick="openProjectManager()" style="width:100%; margin-top:6px; font-size:11px; background:#334155; color:#94a3b8; border:1px dashed #475569;">⚙ 管理项目</button>
                <button class="btn btn-sm" id="btnEvidenceFolder" onclick="selectEvidenceFolder()" style="width:100%; margin-top:6px; font-size:11px; background:#334155; color:#94a3b8; border:1px dashed #475569;">📁 证据文件夹</button>
                <div id="evidenceFolderPath" style="font-size:10px; color:#64748b; margin-top:4px; text-align:center; display:none;"></div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active" onclick="navigateTo('dashboard')">
                    <span class="icon">&#9632;</span> 仪表盘
                </div>
                <div class="nav-item" onclick="navigateTo('meetings')">
                    <span class="icon">&#128197;</span> 会议
                    <span class="badge-count" id="meetingCount">0</span>
                </div>
                <div class="nav-item" onclick="navigateTo('opl')">
                    <span class="icon">&#9888;</span> 问题清单
                    <span class="badge-count" id="oplCount">0</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                数据本地保存 &middot; 项目管理跟踪面板 v3.3
            </div>
        </aside>

        <!-- Main -->
        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <h2 id="pageTitle">仪表盘</h2>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-sm" onclick="exportCSV()">导出 CSV</button>
                    <button class="btn btn-success btn-sm" onclick="openMinutesUpload()">上传会议纪要</button>
                    <button class="btn btn-primary btn-sm" onclick="openModal('opl')">+ 新建问题</button>
                </div>
            </header>

            <!-- Page: Dashboard -->
            <div class="page-content" id="page-dashboard">
                <div class="stats-grid" id="dashboardStats"></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="card">
                        <div class="card-header"><span class="card-title">最近动态</span></div>
                        <div class="card-body" id="recentActivity"></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">逾期问题</span></div>
                        <div class="card-body" id="overdueItems"></div>
                    </div>
                </div>
            </div>

            <!-- Page: Meetings -->
            <div class="page-content" id="page-meetings" style="display:none;">
                <div class="filter-bar">
                    <input type="text" placeholder="搜索会议..." id="meetingSearch" oninput="renderMeetings()">
                    <button class="btn btn-primary" onclick="openModal('meeting')">+ 新建会议主题</button>
                </div>
                <div class="meeting-list-grid" id="meetingListGrid"></div>
                <div id="meetingDetailView" style="display:none;"></div>
            </div>

            <!-- Page: OPL -->
            <div class="page-content" id="page-opl" style="display:none;">
                <div class="stats-grid" id="oplStats"></div>
                <!-- Tab switcher -->
                <div style="display:flex; gap:0; margin-bottom:20px; border-bottom:2px solid var(--border);">
                    <div class="opl-tab active" id="oplTabOpen" onclick="switchOPLTab('open')" style="padding:10px 20px; cursor:pointer; font-size:14px; font-weight:600; border-bottom:2px solid var(--primary); margin-bottom:-2px; color:var(--primary);">
                        进行中 <span id="oplTabOpenCount" style="background:var(--warning-light);color:#b45309;padding:1px 7px;border-radius:10px;font-size:11px;margin-left:4px;">0</span>
                    </div>
                    <div class="opl-tab" id="oplTabClosed" onclick="switchOPLTab('closed')" style="padding:10px 20px; cursor:pointer; font-size:14px; font-weight:500; color:var(--text-muted); margin-bottom:-2px;">
                        已关闭存档 <span id="oplTabClosedCount" style="background:var(--success-light);color:#047857;padding:1px 7px;border-radius:10px;font-size:11px;margin-left:4px;">0</span>
                    </div>
                </div>
                <!-- Active OPL (Open / In Progress) -->
                <div class="card" id="oplActiveCard">
                    <div class="card-header">
                        <span class="card-title">待处理 / 进行中</span>
                        <button class="btn btn-primary btn-sm" onclick="openModal('opl')">+ 新建问题</button>
                    </div>
                    <div class="card-body">
                        <div class="filter-bar">
                            <input type="text" placeholder="搜索..." id="oplSearch" oninput="renderOPL()">
                            <select id="oplStatusFilter" onchange="renderOPL()">
                                <option value="">所有状态</option>
                                <option value="Open">待处理</option>
                                <option value="In Progress">进行中</option>
                            </select>
                            <select id="oplPriorityFilter" onchange="renderOPL()">
                                <option value="">所有优先级</option>
                                <option value="High">高</option>
                                <option value="Medium">中</option>
                                <option value="Low">低</option>
                            </select>

    <script>
        // ==================== Data Store ====================
        let store = {
            projects: [],
            currentProjectId: '',
            meetings: [],
            opls: [],
            activities: []

        let currentPage = 'dashboard';
        let currentMeetingDetail = null;

        // ==================== Display Helpers ====================
        function statusCN(s) {
            const map = {'Open':'待处理','In Progress':'进行中','Closed':'已关闭','Overdue':'已逾期'};
            return map[s] || s;
        }
        function priorityCN(p) {
            const map = {'High':'高','Medium':'中','Low':'低'};
            return map[p] || p;
        }
        function categoryCN(c) {
            const map = {'Design':'设计','Process':'工艺','Material':'材料','Quality':'质量','Test':'测试','Production':'生产','Other':'其他','Supply Chain':'供应链'};
            return map[c] || c;
        }
        function frequencyCN(f) {
            const map = {'weekly':'每周','biweekly':'每两周','monthly':'每月','adhoc':'临时'};
            return map[f] || f;
        }

        // ==================== Persistence ====================
        const DATA_VERSION = 'v11-folder-evidence';
        function loadStore() {
            const ver = localStorage.getItem('project-hub-version');
            if (ver !== DATA_VERSION) {
                localStorage.removeItem('project-hub-data');
                localStorage.setItem('project-hub-version', DATA_VERSION);
                initSampleData();
                restoreEvidencePreviews();
                return;
            }
            const saved = localStorage.getItem('project-hub-data');
            if (saved) {
                store = JSON.parse(saved);
                // Migrate: ensure projects and currentProjectId exist
                if (!store.projects) store.projects = [];
                if (!store.currentProjectId) {
                    const defaultId = 'proj-bmu';
                    if (!store.projects.find(p => p.id === defaultId)) {
                        store.projects.push({ id: defaultId, name: 'BMU代工厂管理', desc: 'BMU代工厂审核与问题跟踪', createdAt: '2026-01-01', color: '#4f46e5' });
                    }
                    store.currentProjectId = defaultId;
                }
                // Migrate old data
                getCurrentProjectOPLs().forEach(o => {
                    if (!o.evidenceFiles) o.evidenceFiles = parseEvidenceFromNote(o.note || '');
                    if (o.note === undefined) o.note = '';
                    if (!o.projectId) o.projectId = store.currentProjectId;
                });
                store.meetings.forEach(m => {
                    if (!m.projectId) m.projectId = store.currentProjectId;
                });
            } else {
                initSampleData();
            }
            restoreEvidencePreviews();
        }

        async function restoreEvidencePreviews() {
            // Restore dataUrls for image files from IndexedDB or local folder
            if (!store.opls) return;
            for (const opl of store.opls) {
                const files = opl.evidenceFiles || [];
                for (const f of files) {
                    // Clean up marker
                    if (f._hasDataUrl) { delete f._hasDataUrl; }
                    if (f.type === 'image' && f.fileId && !f.dataUrl) {
                        // Try local folder first
                        let buffer = null;
                        let mimeType = 'image/png';
                        if (f._inFolder) {
                            const folderData = await EvidenceFolder.readFile(opl.id, f.fileId, f.name || '');
                            if (folderData) {
                                buffer = folderData.buffer;
                                mimeType = folderData.type || 'image/png';
                            }
                        }
                        // Fallback to IndexedDB
                        if (!buffer) {
                            try {
                                const data = await EvidenceDB.get(f.fileId);
                                if (data && data.buffer) {
                                    buffer = data.buffer;
                                    mimeType = data.type || 'image/png';
                                }
                            } catch (e) {
                                // File not in IndexedDB, skip
                            }
                        }
                        if (buffer) {
                            const blob = new Blob([buffer], { type: mimeType });
                            f.dataUrl = await new Promise((resolve) => {
                                const reader = new FileReader();
                                reader.onload = () => resolve(reader.result);
                                reader.readAsDataURL(blob);
                            });
                        }
                    }
                }
            }
        }

        function saveStore() {
            // Ensure currentProjectId is set
            if (!store.currentProjectId && store.projects.length > 0) {
                store.currentProjectId = store.projects[0].id;
            }
            // Strip large dataUrls from evidenceFiles before saving to localStorage
            // (actual file data is stored in IndexedDB, dataUrl can be regenerated)
            const storeCopy = JSON.parse(JSON.stringify(store));
            storeCopy.opls.forEach(o => {
                (o.evidenceFiles || []).forEach(f => {
                    if (f.dataUrl && f.dataUrl.length > 50000) {
                        // Keep only a small thumbnail marker; full dataUrl is regenerated from IndexedDB
                        f._hasDataUrl = true;
                        f.dataUrl = '';
                    }
                });
            });
            try {
                localStorage.setItem('project-hub-data', JSON.stringify(storeCopy));
            } catch (e) {
                // localStorage full - try stripping all dataUrls
                storeCopy.opls.forEach(o => {
                    (o.evidenceFiles || []).forEach(f => {
                        f._hasDataUrl = !!f.dataUrl;
                        f.dataUrl = '';
                    });
                });
                try {
                    localStorage.setItem('project-hub-data', JSON.stringify(storeCopy));
                } catch (e2) {
                    showToast('存储空间不足，请清理旧数据');
                }
            }
        }

            {id:"OPL-096",desc:"确认三防漆等胶水在仓库和线边仓的存储温度要求，并制定上线前提前备料及温度平衡的具体方案。",category:"审核问题",owner:"李晴天, 杜斌",dueDate:"2026-03-15",createdAt:"2026-01-20",priority:"中",status:"Closed",closedAt:"",note:"措施: 1.化学品仓库储存温度8-25℃，车间温度25±3℃，胶水TDS最佳储存温度20-25℃ ，与供应商确认纳米胶实际的储存环境及影响状态。 2.纳米胶水执行专区、专架、专用标识管理，实行先进先出（FIFO）与批号全程追溯 3.纳米胶水领料、转运、存放全程密封避光、恒温管控，上线前温度平衡时间不低于 24小时，确保胶水温度达到 23℃～27℃ 后方可投入使用 4. 小米防爆柜和线体区域增加温湿度表实时; 进展: 3/16 赵工3/17来立讯现场确认 3/15 参考附件; 佐证: ANG T5备料及温度平衡方案",extensions:[],source:"1/20龙清老师审核"},

        function initSampleData() {
            // Create default project
            const defaultProjectId = 'proj-bmu';
            store.projects = [
                { id: defaultProjectId, name: 'BMU代工厂管理', desc: 'BMU代工厂审核与问题跟踪', createdAt: '2026-01-01', color: '#4f46e5' }
            ];
            store.currentProjectId = defaultProjectId;

            store.meetings = [];
            store.opls = AUDIT_OPL_DATA.map(o => ({
                id: o.id,
                desc: o.desc,
                category: o.category || '审核问题',
                owner: o.owner || '待分配',
                dueDate: o.dueDate || '',
                createdAt: o.createdAt || '',
                priority: o.priority || '中',
                status: o.status || 'Open',
                closedAt: o.closedAt || '',
                note: o.note || '',
                extensions: o.extensions || [],
                evidenceFiles: parseEvidenceFromNote(o.note || '')
            }));
            store.activities = [];
            saveStore();
        }

        function parseEvidenceFromNote(note) {
            const files = [];
            if (!note) return files;
            // Try to extract 佐证 section
            const match = note.match(/佐证[:：]\s*(.+?)(?:$|(?:\s*(?:进展|措施|状态)[:：]))/);
            if (match) {
                const evidenceText = match[1].trim();
                // Split by common separators
                const items = evidenceText.split(/[,;，；、\s]+/).filter(Boolean);
                items.forEach(item => {
                    if (item) {
                        files.push({
                            name: item,
                            type: inferFileType(item),
                            url: '',
                            remark: '',
                            fileId: '',
                            dataUrl: '',
                            fileSize: 0
                        });
                    }
                });
            }
            return files;
        }

        // ==================== Navigation ====================
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.page-content').forEach(p => p.style.display = 'none');
            document.getElementById('page-' + page).style.display = 'block';

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event && event.target && event.target.closest('.nav-item') && event.target.closest('.nav-item').classList.add('active');

            updateTopbarTitle();

            if (page === 'dashboard') renderDashboard();
            else if (page === 'meetings') { renderMeetings(); document.getElementById('meetingDetailView').style.display = 'none'; document.getElementById('meetingListGrid').style.display = 'grid'; }
            else if (page === 'opl') renderOPL();
        }

        function getCurrentProject() {
            return store.projects.find(p => p.id === store.currentProjectId) || store.projects[0] || { id: '', name: '全部项目', desc: '' };
        }

        function getCurrentProjectOPLs() {
            return store.opls.filter(o => o.projectId === store.currentProjectId);
        }

        function getCurrentProjectMeetings() {
            return store.meetings.filter(m => m.projectId === store.currentProjectId);
        }

        function switchProject(projectId) {
            store.currentProjectId = projectId;
            saveStore();
            refreshCurrentView();
            renderProjectSelector();
        }

        function refreshCurrentView() {
            if (currentPage === 'dashboard') renderDashboard();
            else if (currentPage === 'meetings') { renderMeetings(); document.getElementById('meetingDetailView').style.display = 'none'; document.getElementById('meetingListGrid').style.display = 'grid'; }
            else if (currentPage === 'opl') renderOPL();
            updateCounts();
            updateTopbarTitle();
        }

        function updateTopbarTitle() {
            const project = getCurrentProject();
            const titles = { dashboard: '仪表盘', meetings: '会议', opl: '问题清单' };
            const pageTitle = titles[currentPage] || currentPage;
            document.getElementById('pageTitle').innerHTML = pageTitle + ' <span style="font-size:12px; color:var(--text-muted); font-weight:400;">&middot; ' + project.name + '</span>';
        }

        function renderProjectSelector() {
            const select = document.getElementById('projectSelect');
            if (!select) return;
            select.innerHTML = store.projects.map(p =>
                '<option value="' + p.id + '"' + (p.id === store.currentProjectId ? ' selected' : '') + '>' + p.name + '</option>'
            ).join('');
            if (store.projects.length === 0) {
                select.innerHTML = '<option value="">— 无项目 —</option>';
            }
        }

        function openProjectManager() {
            renderProjectList();
            openModal('projectManager');
        }

        function renderProjectList() {
            const container = document.getElementById('projectListContainer');
            if (!container) return;
            const current = store.currentProjectId;
            container.innerHTML = store.projects.map(p => {
                const isCurrent = p.id === current;
                return '<div class="project-item' + (isCurrent ? ' current' : '') + '">' +
                    '<div>' +
                        '<div class="pi-name">' + (isCurrent ? '● ' : '') + p.name + '</div>' +
                        '<div class="pi-desc">' + (p.desc || '') + ' · ' + (p.createdAt || '') + '</div>' +
                    '</div>' +
                    '<div class="pi-actions">' +
                        (isCurrent ? '<span style="font-size:11px; color:var(--primary);">当前</span>' : '<button class="btn btn-sm btn-ghost" onclick="switchProject(&quot;' + p.id + '&quot;); closeModal(&quot;projectManager&quot;);">切换</button>') +
                        (store.projects.length > 1 ? '<button class="btn btn-sm btn-ghost" style="color:var(--danger);" onclick="deleteProject(&quot;' + p.id + '&quot;)">删除</button>' : '') +
                    '</div>' +
                '</div>';
            }).join('') || '<div style="font-size:13px; color:var(--text-muted); padding:10px;">暂无项目</div>';
        }

        function createProject() {
            const name = document.getElementById('newProjectName').value.trim();
            if (!name) { showToast('请输入项目名称'); return; }
            const desc = document.getElementById('newProjectDesc').value.trim();
            const id = 'proj-' + Date.now();
            store.projects.push({ id: id, name: name, desc: desc, createdAt: new Date().toISOString().split('T')[0], color: '#4f46e5' });
            if (!store.currentProjectId) store.currentProjectId = id;
            saveStore();
            document.getElementById('newProjectName').value = '';
            document.getElementById('newProjectDesc').value = '';
            renderProjectList();
            renderProjectSelector();
            showToast('项目「' + name + '」已创建');
        }

        function deleteProject(projectId) {
            if (store.projects.length <= 1) { showToast('至少保留一个项目'); return; }
            const project = store.projects.find(p => p.id === projectId);
            if (!project) return;
            if (!confirm('确定要删除项目「' + project.name + '」吗？\n该项目的 OPL 和会议记录不会丢失，将归入当前项目。')) return;
            const fallbackId = store.projects.find(p => p.id !== projectId).id;
            getCurrentProjectOPLs().forEach(o => { if (o.projectId === projectId) o.projectId = fallbackId; });
            store.meetings.forEach(m => { if (m.projectId === projectId) m.projectId = fallbackId; });
            if (store.currentProjectId === projectId) store.currentProjectId = fallbackId;
            store.projects = store.projects.filter(p => p.id !== projectId);
            saveStore();
            renderProjectList();
            renderProjectSelector();
            refreshCurrentView();
            showToast('项目「' + project.name + '」已删除，数据已迁移');
        }

        // ==================== Dashboard ====================
        function renderDashboard() {
            const projectOPLs = getCurrentProjectOPLs();
            const projectMeetings = getCurrentProjectMeetings();
            const openOPL = projectOPLs.filter(o => o.status !== 'Closed').length;
            const overdueOPL = projectOPLs.filter(o => o.status !== 'Closed' && new Date(o.dueDate) < new Date()).length;
            const totalMeetings = projectMeetings.reduce((sum, m) => sum + m.followups.length, 0);
            const thisWeek = projectOPLs.filter(o => {
                const d = new Date(o.createdAt);
                const now = new Date();
                const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
                return d >= weekAgo;
            }).length;

            document.getElementById('dashboardStats').innerHTML = `
                <div class="stat-card info">
                    <div class="stat-label">待解决问题</div>
                    <div class="stat-value">${openOPL}</div>
                    <div class="stat-detail">${projectOPLs.length} 项总计</div>
                </div>
                <div class="stat-card ${overdueOPL > 0 ? 'danger' : 'success'}">
                    <div class="stat-label">已逾期</div>
                    <div class="stat-value">${overdueOPL}</div>
                    <div class="stat-detail">项已超过截止日期</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">会议记录</div>
                    <div class="stat-value">${totalMeetings}</div>
                    <div class="stat-detail">${projectMeetings.length} 个会议主题</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-label">本周新增</div>
                    <div class="stat-value">${thisWeek}</div>
                    <div class="stat-detail">个新问题项</div>
                </div>
            `;

            // Recent activity
            const actHtml = store.activities.slice(0, 8).map(a => `
                <div style="display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-light);">
                    <span style="font-size:11px; color:var(--text-muted); white-space:nowrap; min-width:110px;">${a.time}</span>
                    <span style="font-size:13px;">${a.content}</span>
                </div>
            `).join('');
            document.getElementById('recentActivity').innerHTML = actHtml || '<div class="empty-state"><div class="es-desc">暂无动态</div></div>';

            // Overdue
            const overdueItems = projectOPLs.filter(o => o.status !== 'Closed' && new Date(o.dueDate) < new Date());
            const overdueHtml = overdueItems.slice(0, 6).map(item => `
                <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-light);">
                    <span class="badge badge-overdue">${item.id}</span>
                    <span style="font-size:13px; flex:1;">${item.desc}</span>
                    <span class="owner-tag">${item.owner}</span>
                    <span style="font-size:11px; color:var(--danger);">${item.dueDate}</span>
                </div>
            `).join('');
            document.getElementById('overdueItems').innerHTML = overdueHtml || '<div class="empty-state"><div class="es-desc">暂无逾期项</div></div>';

            updateCounts();
        }

        function updateCounts() {
            document.getElementById('meetingCount').textContent = getCurrentProjectMeetings().length;
            document.getElementById('oplCount').textContent = getCurrentProjectOPLs().filter(o => o.status !== 'Closed').length;
        }

        // ==================== Meetings ====================
        function renderMeetings() {
            const search = (document.getElementById('meetingSearch').value || '').toLowerCase();
            let filtered = getCurrentProjectMeetings();
            if (search) filtered = filtered.filter(m => m.name.toLowerCase().includes(search));

            const html = filtered.map(m => `
                <div class="meeting-card" onclick="showMeetingDetail('${m.id}')">
                    <div class="mc-title">${m.name}</div>
                    <div class="mc-meta">
                        <span>&#128197; ${frequencyCN(m.frequency)}</span>
                        <span>&#128101; ${(m.depts || []).join(', ')}</span>
                    </div>
                    ${m.followups.length > 0 ? `<div class="mc-followups">&#128196; ${m.followups.length} 次会议记录</div>` : ''}
                </div>
            `).join('');

            document.getElementById('meetingListGrid').innerHTML = html || '<div class="empty-state"><div class="es-icon">&#128197;</div><div class="es-title">暂无会议</div><div class="es-desc">创建会议主题来跟踪代工厂沟通</div></div>';
        }

        function showMeetingDetail(id) {
            const m = store.meetings.find(x => x.id === id);
            if (!m) return;
            currentMeetingDetail = id;

            document.getElementById('meetingListGrid').style.display = 'none';
            const detailEl = document.getElementById('meetingDetailView');
            detailEl.style.display = 'block';

            const followupsHtml = m.followups.length > 0
                ? `<div class="followup-timeline">${m.followups.map(f => `
                    <div class="followup-item">
                        <div class="fi-date">&#128197; ${f.date} ${f.attendees ? ' &nbsp;&#128101; ' + f.attendees : ''}${f.link ? ' &nbsp;<a href="' + escapeHtml(f.link) + '" target="_blank" style="color:var(--primary); font-size:13px;">🔗 飞书文档</a>' : ''}</div>
                        <div class="minutes-content-box">${escapeHtml(f.notes || '暂无记录')}</div>
                    </div>
                `).join('')}</div>`
                : '<div class="empty-state"><div class="es-desc">暂无会议记录</div></div>';

            detailEl.innerHTML = `
                <div class="meeting-detail-header">
                    <button class="btn btn-ghost" onclick="backToMeetingList()">&#8592; 返回</button>
                    <h3 style="font-size:18px; font-weight:600;">${m.name}</h3>
                    <span class="badge badge-inprogress">${frequencyCN(m.frequency)}</span>
                </div>
                <div style="display:grid; grid-template-columns:2fr 1fr; gap:20px;">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">会议记录</span>
                            <button class="btn btn-sm btn-primary" onclick="openFollowupModal('${m.id}')">+ 添加记录</button>
                        </div>
                        <div class="card-body">${followupsHtml}</div>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">会议信息</span></div>
                        <div class="card-body">
                            <div style="font-size:13px; margin-bottom:10px;"><strong>频率：</strong> ${frequencyCN(m.frequency)}</div>
                            <div style="font-size:13px; margin-bottom:10px;"><strong>参与部门：</strong> ${(m.depts || []).join(', ') || '未设置'}</div>
                            <div style="font-size:13px; margin-bottom:10px;"><strong>创建时间：</strong> ${m.createdAt}</div>
                            <div style="font-size:13px; margin-bottom:10px;"><strong>累计记录：</strong> ${m.followups.length} 次</div>
                            ${m.docUrl ? `<div style="font-size:13px;"><strong>文档：</strong> <a href="${m.docUrl}" target="_blank" style="color:var(--primary);">在飞书中打开</a></div>` : ''}
                            <hr style="margin:16px 0; border:none; border-top:1px solid var(--border-light);">
                            <button class="btn btn-danger btn-sm" onclick="deleteMeeting('${m.id}')">删除会议</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function backToMeetingList() {
            document.getElementById('meetingDetailView').style.display = 'none';
            document.getElementById('meetingListGrid').style.display = 'grid';
            currentMeetingDetail = null;
        }

        // ==================== OPL ====================
        let oplCurrentTab = 'open'; // 'open' or 'closed'

        function switchOPLTab(tab) {
            oplCurrentTab = tab;
            const tabOpen = document.getElementById('oplTabOpen');
            const tabClosed = document.getElementById('oplTabClosed');
            const cardActive = document.getElementById('oplActiveCard');
            const cardClosed = document.getElementById('oplClosedCard');
            if (tab === 'open') {
                tabOpen.style.borderBottom = '2px solid var(--primary)';
                tabOpen.style.color = 'var(--primary)';
                tabOpen.style.fontWeight = '600';
                tabClosed.style.borderBottom = '2px solid transparent';
                tabClosed.style.color = 'var(--text-muted)';
                tabClosed.style.fontWeight = '500';
                cardActive.style.display = 'block';
                cardClosed.style.display = 'none';
            } else {
                tabClosed.style.borderBottom = '2px solid var(--success)';
                tabClosed.style.color = '#047857';
                tabClosed.style.fontWeight = '600';
                tabOpen.style.borderBottom = '2px solid transparent';
                tabOpen.style.color = 'var(--text-muted)';
                tabOpen.style.fontWeight = '500';
                cardActive.style.display = 'none';
                cardClosed.style.display = 'block';
            }
            renderOPL();
        }

        function renderOPL() {
            const search = (document.getElementById('oplSearch').value || '').toLowerCase();
            const statusFilter = document.getElementById('oplStatusFilter').value;
            const priorityFilter = document.getElementById('oplPriorityFilter').value;
            const closedSearch = (document.getElementById('oplClosedSearch')?.value || '').toLowerCase();

            // Split into active and closed
            const activeOPLs = getCurrentProjectOPLs().filter(o => o.status !== 'Closed');
            const closedOPLs = getCurrentProjectOPLs().filter(o => o.status === 'Closed');

            // Stats (always show totals)
            const total = store.opls.length;
            const open = getCurrentProjectOPLs().filter(o => o.status === 'Open').length;
            const inProg = getCurrentProjectOPLs().filter(o => o.status === 'In Progress').length;
            const closed = closedOPLs.length;
            const overdue = activeOPLs.filter(o => o.dueDate && new Date(o.dueDate) < new Date()).length;
            const onTime = closedOPLs.filter(o => o.closedAt && o.dueDate && new Date(o.closedAt) <= new Date(o.dueDate)).length;
            const onTimeRate = closed > 0 ? Math.round(onTime / closed * 100) : '-';

            document.getElementById('oplStats').innerHTML = `
                <div class="stat-card"><div class="stat-label">总计</div><div class="stat-value">${total}</div></div>
                <div class="stat-card warning"><div class="stat-label">待处理</div><div class="stat-value">${open}</div></div>
                <div class="stat-card info"><div class="stat-label">进行中</div><div class="stat-value">${inProg}</div></div>
                <div class="stat-card ${overdue > 0 ? 'danger' : 'success'}"><div class="stat-label">已逾期</div><div class="stat-value">${overdue}</div></div>
                <div class="stat-card success"><div class="stat-label">已关闭</div><div class="stat-value">${closed}</div></div>
                <div class="stat-card"><div class="stat-label">按时完成率</div><div class="stat-value">${onTimeRate}${onTimeRate !== '-' ? '%' : ''}</div></div>
            `;

            // Update tab counts
            document.getElementById('oplTabOpenCount').textContent = activeOPLs.length;
            document.getElementById('oplTabClosedCount').textContent = closedOPLs.length;

            // ---- Render Active OPL Table ----
            let filteredActive = activeOPLs;
            if (search) filteredActive = filteredActive.filter(o => o.desc.toLowerCase().includes(search) || o.owner.toLowerCase().includes(search));
            if (statusFilter) filteredActive = filteredActive.filter(o => o.status === statusFilter);
            if (priorityFilter) filteredActive = filteredActive.filter(o => o.priority === priorityFilter);

            const activeRows = filteredActive.map(o => {
                const statusClass = o.status === 'In Progress' ? 'inprogress' : o.status.toLowerCase();
                const priorityClass = o.priority.toLowerCase();
                const isOverdue = o.dueDate && new Date(o.dueDate) < new Date();
                const extCount = (o.extensions && o.extensions.length) || 0;
                let dueDateDisplay = '';
                if (isOverdue) {
                    const days = Math.ceil((new Date() - new Date(o.dueDate)) / (1000*60*60*24));
                    dueDateDisplay = `<span style="color:var(--danger); font-weight:600;">${o.dueDate}</span><br><span style="font-size:11px; color:var(--danger);">逾期${days}天</span>`;
                } else {
                    dueDateDisplay = o.dueDate || '<span style="color:var(--text-muted);">未设置</span>';
                }
                if (extCount > 0) dueDateDisplay += `<br><span style="font-size:10px; color:var(--warning);">已延期${extCount}次</span>`;
                return `<tr>
                    <td><strong>${o.id}</strong></td>
                    <td style="max-width:200px;">${o.desc}</td>
                    <td>${categoryCN(o.category)}</td>
                    <td><span class="owner-tag">${o.owner}</span></td>
                    <td style="font-size:12px; color:var(--text-muted); white-space:nowrap;">${o.createdAt || '-'}</td>
                    <td style="min-width:90px;">${dueDateDisplay}</td>
                    <td><span class="badge badge-${priorityClass}">${priorityCN(o.priority)}</span></td>
                    <td><span class="badge badge-${statusClass}">${statusCN(o.status)}</span></td>
                    <td class="note-cell" title="${escapeHtml(o.note || '')}">${o.note || '-'}</td>
                    <td class="evidence-cell">${renderEvidenceFilesCell(o)}</td>
                    <td>
                        <select class="btn btn-sm" onchange="updateOPLStatus('${o.id}', this.value)" style="font-size:11px;padding:3px 6px;">
                            <option value="" disabled selected>操作</option>
                            <option value="edit">编辑</option>
                            <option value="Open">设为待处理</option>
                            <option value="In Progress">进行中</option>
                            <option value="Closed">关闭并存档</option>
                            <option value="延期">申请延期</option>
                            <option value="delete">删除</option>
                        </select>
                    </td>
                </tr>`;
            }).join('');

            document.getElementById('oplTable').innerHTML = `
                <table>
                    <thead><tr><th>编号</th><th>描述</th><th>类别</th><th>负责人</th><th>创建日期</th><th>截止日期</th><th>优先级</th><th>状态</th><th>备注</th><th>佐证文件</th><th>操作</th></tr></thead>
                    <tbody>${activeRows || '<tr><td colspan="11"><div class="empty-state"><div class="es-desc">暂无待处理问题</div></div></td></tr>'}</tbody>
                </table>
            `;

            // ---- Render Closed/Archived OPL Table ----
            let filteredClosed = closedOPLs;
            if (closedSearch) filteredClosed = filteredClosed.filter(o => o.desc.toLowerCase().includes(closedSearch) || o.owner.toLowerCase().includes(closedSearch));

            const closedRows = filteredClosed.map(o => {
                const priorityClass = o.priority.toLowerCase();
                const extCount = (o.extensions && o.extensions.length) || 0;
                let dueDateDisplay = '';
                if (o.closedAt && o.dueDate) {
                    const onTimeFlag = new Date(o.closedAt) <= new Date(o.dueDate);
                    dueDateDisplay = `<span style="color:${onTimeFlag?'var(--success)':'var(--text-muted)'};">${o.dueDate}</span>`;
                    if (onTimeFlag) {
                        dueDateDisplay += `<br><span style="font-size:11px; color:var(--success);">✓ 按时完成</span>`;
                    } else {
                        dueDateDisplay += `<br><span style="font-size:11px; color:var(--warning);">实际完成：${o.closedAt}</span>`;
                    }
                } else {
                    dueDateDisplay = o.dueDate || '-';
                }
                if (extCount > 0) dueDateDisplay += `<br><span style="font-size:10px; color:var(--warning);">延期${extCount}次</span>`;
                return `<tr>
                    <td><strong>${o.id}</strong></td>
                    <td style="max-width:200px;">${o.desc}</td>
                    <td>${categoryCN(o.category)}</td>
                    <td><span class="owner-tag">${o.owner}</span></td>
                    <td style="font-size:12px; color:var(--text-muted); white-space:nowrap;">${o.createdAt || '-'}</td>
                    <td style="min-width:90px;">${dueDateDisplay}</td>
                    <td><span class="badge badge-${priorityClass}">${priorityCN(o.priority)}</span></td>
                    <td><span style="font-size:12px; color:var(--text-muted);">${o.closedAt || '-'}</span></td>
                    <td class="note-cell" title="${escapeHtml(o.note || '')}">${o.note || '-'}</td>
                    <td class="evidence-cell">${renderEvidenceFilesCell(o)}</td>
                    <td>
                        <select class="btn btn-sm" onchange="updateOPLStatus('${o.id}', this.value)" style="font-size:11px;padding:3px 6px;">
                            <option value="" disabled selected>操作</option>
                            <option value="edit">编辑</option>
                            <option value="Open">重新打开</option>
                            <option value="delete">删除</option>
                        </select>
                    </td>
                </tr>`;
            }).join('');

            document.getElementById('oplClosedTable').innerHTML = `
                <table>
                    <thead><tr><th>编号</th><th>描述</th><th>类别</th><th>负责人</th><th>创建日期</th><th>截止日期</th><th>优先级</th><th>关闭日期</th><th>备注</th><th>佐证文件</th><th>操作</th></tr></thead>
                    <tbody>${closedRows || '<tr><td colspan="11"><div class="empty-state"><div class="es-desc">暂无已关闭问题</div></div></td></tr>'}</tbody>
                </table>
            `;
        }

        function updateOPLStatus(id, value) {
            if (value === 'edit') {
                editOPL(id);
                return;
            } else if (value === 'delete') {
                if (confirm('确定删除此问题项？')) {
                    store.opls = store.opls.filter(o => o.id !== id);
                    addActivity(`已删除 ${id}`);
                }
            } else if (value === '延期') {
                requestExtension(id);
                return;
            } else {
                const opl = store.opls.find(o => o.id === id);
                if (opl) {
                    const oldStatus = opl.status;
                    opl.status = value;
                    if (value === 'Closed') {
                        opl.closedAt = new Date().toISOString().split('T')[0];
                        const due = opl.dueDate ? new Date(opl.dueDate) : null;
                        const closed = new Date(opl.closedAt);
                        if (due && closed <= due) {
                            addActivity(`${id} 已按时关闭并存档（完成日期：${opl.closedAt}）`);
                        } else if (due) {
                            const days = Math.ceil((closed - due) / (1000*60*60*24));
                            addActivity(`${id} 已关闭并存档，逾期${days}天（截止：${opl.dueDate}，完成：${opl.closedAt}）`);
                        } else {
                            addActivity(`${id} 已关闭并存档（完成日期：${opl.closedAt}）`);
                        }
                        showToast(`${id} 已关闭，已移入「已关闭存档」`);
                    } else {
                        if (oldStatus === 'Closed') { opl.closedAt = ''; }
                        addActivity(`${id} 状态变更为${statusCN(value)}`);
                        if (oldStatus === 'Closed') {
                            showToast(`${id} 已重新打开，已移回「进行中」`);
                        }
                    }
                }
            }
            saveStore();
            renderOPL();
            updateCounts();
        }

        function requestExtension(id) {
            const opl = store.opls.find(o => o.id === id);
            if (!opl) return;

        // ==================== Evidence Folder (Local File System) ====================
        const EvidenceFolder = (() => {
            const FOLDER_DB = 'OPLEvidenceFolderDB';
            let _handle = null;

            // Check if File System Access API is supported
            function isSupported() {
                return typeof window.showDirectoryPicker === 'function';
            }

            async function openFolderDB() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(FOLDER_DB, 1);
                    req.onupgradeneeded = (e) => {
                        if (!e.target.result.objectStoreNames.contains('handles')) {
                            e.target.result.createObjectStore('handles', { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async function saveHandle(handle) {
                const db = await openFolderDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('handles', 'readwrite');
                    tx.objectStore('handles').put({ key: 'evidenceFolder', handle });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            async function loadHandle() {
                try {
                    const db = await openFolderDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction('handles', 'readonly');
                        const req = tx.objectStore('handles').get('evidenceFolder');
                        req.onsuccess = async () => {
                            if (!req.result) { resolve(null); return; }
                            const handle = req.result.handle;
                            // Verify permission
                            const opts = { mode: 'readwrite' };
                            const ok = await handle.queryPermission(opts);
                            if (ok === 'granted') {
                                _handle = handle;
                                resolve(handle);
                            } else if (ok === 'prompt') {
                                try {
                                    await handle.requestPermission(opts);
                                    _handle = handle;
                                    resolve(handle);
                                } catch (e) {
                                    resolve(null);
                                }
                            } else {
                                resolve(null);
                            }
                        };
                        req.onerror = () => resolve(null);
                    });
                } catch (e) {
                    return null;
                }
            }

            async function getHandle() {
                if (_handle) return _handle;
                return await loadHandle();
            }

            async function getOrCreateOPLFolder(oplId) {
                const root = await getHandle();
                if (!root) return null;
                try {
                    return await root.getDirectoryHandle(oplId, { create: true });
                } catch (e) {
                    return null;
                }
            }

            async function writeFile(oplId, fileId, name, buffer) {
                const oplFolder = await getOrCreateOPLFolder(oplId);
                if (!oplFolder) return false;
                try {
                    // Use fileId as filename to avoid name collisions
                    const ext = name.includes('.') ? name.substring(name.lastIndexOf('.')) : '';
                    const safeName = fileId + ext;
                    const fileHandle = await oplFolder.getFileHandle(safeName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(buffer);
                    await writable.close();
                    return true;
                } catch (e) {
                    console.error('Evidence folder write error:', e);
                    return false;
                }
            }

            async function readFile(oplId, fileId, name) {
                const oplFolder = await getOrCreateOPLFolder(oplId);
                if (!oplFolder) return null;
                try {
                    const ext = name.includes('.') ? name.substring(name.lastIndexOf('.')) : '';
                    const safeName = fileId + ext;
                    const fileHandle = await oplFolder.getFileHandle(safeName);
                    const file = await fileHandle.getFile();
                    const buffer = await file.arrayBuffer();
                    return { buffer, type: file.type, size: file.size, name: file.name };
                } catch (e) {
                    return null;
                }
            }

            async function deleteFile(oplId, fileId, name) {
                const oplFolder = await getOrCreateOPLFolder(oplId);
                if (!oplFolder) return false;
                try {
                    const ext = name.includes('.') ? name.substring(name.lastIndexOf('.')) : '';
                    const safeName = fileId + ext;
                    await oplFolder.removeEntry(safeName);
                    return true;
                } catch (e) {
                    return false;
                }
            }

            async function deleteOPLFolder(oplId) {
                const root = await getHandle();
                if (!root) return false;
                try {
                    await root.removeEntry(oplId, { recursive: true });
                    return true;
                } catch (e) {
                    return false;
                }
            }

            return { isSupported, saveHandle, loadHandle, getHandle, writeFile, readFile, deleteFile, deleteOPLFolder };
        })();

        // ==================== Evidence Files with IndexedDB Storage ====================
        const EvidenceDB = (() => {
            let _db = null;
            const DB_NAME = 'OPLEvidenceDB';
            const DB_VER = 1;
            async function open() {
                if (_db) return _db;
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VER);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('files')) {
                            db.createObjectStore('files', { keyPath: 'id' });
                        }
                    };
                    req.onsuccess = (e) => { _db = e.target.result; resolve(_db); };
                    req.onerror = () => reject(req.error);
                });
            }
            async function put(id, data) {
                const db = await open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('files', 'readwrite');
                    tx.objectStore('files').put({ id, data });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async function get(id) {
                const db = await open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('files', 'readonly');
                    const req = tx.objectStore('files').get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.data : null);
                    req.onerror = () => reject(req.error);
                });
            }
            async function remove(id) {
                const db = await open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('files', 'readwrite');
                    tx.objectStore('files').delete(id);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async function removeMany(ids) {
                const db = await open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('files', 'readwrite');
                    const store = tx.objectStore('files');
                    ids.forEach(id => store.delete(id));
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            return { open, put, get, remove, removeMany };
        })();

        function inferFileType(name) {
            if (!name) return 'other';
            const lower = name.toLowerCase();
            if (lower.endsWith('.xlsx') || lower.endsWith('.xls')) return 'excel';
            if (lower.endsWith('.pdf')) return 'pdf';
            if (lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.gif') || lower.endsWith('.bmp') || lower.endsWith('.webp')) return 'image';
            if (lower.endsWith('.doc') || lower.endsWith('.docx')) return 'doc';
            if (lower.endsWith('.zip') || lower.endsWith('.rar') || lower.endsWith('.7z')) return 'archive';
            if (lower.startsWith('http')) return 'link';
            return 'other';
        }

        function isImageType(type) {
            return type === 'image' || (type === 'link' && false);
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

                html += '</div>';
            }
            html += `<span style="font-size:12px;">${countText}</span>`;
            html += '</div>';
            return html;
        }

        function renderEditEvidenceList() {
            const container = document.getElementById('editEvidenceList');
            if (!container) return;

            (currentEditingEvidenceList || []).forEach((file, index) => {
                const row = document.createElement('div');

                    </div>
                    <div class="ev-right">
                        ${hasPreview ? `<img class="ev-preview" src="${file.dataUrl}" title="点击放大" onclick="showEvidenceLightbox(event,'${file.dataUrl}')">` : `<div class="ev-preview-placeholder">${file.type === 'image' ? '🖼' : file.type === 'pdf' ? '📄' : file.type === 'excel' ? '📊' : file.type === 'doc' ? '📝' : file.type === 'archive' ? '📦' : '📎'}</div>`}
                        <div class="ev-file-upload">
                            <input type="file" id="evFileInput${index}" style="display:none;" onchange="handleEvidenceFileUpload(${index}, this)">
                            <button type="button" class="btn-upload" onclick="document.getElementById('evFileInput${index}').click()">📁 上传</button>
                            <button type="button" class="btn-remove" onclick="removeEditEvidence(${index})">删除</button>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function updateEvidenceField(index, field, value) {
            if (currentEditingEvidenceList && currentEditingEvidenceList[index]) {
                currentEditingEvidenceList[index][field] = value;
                if (field === 'name') {
                    currentEditingEvidenceList[index].type = inferFileType(value);
                }
            }
        }

        async function handleEvidenceFileUpload(index, input) {
            const file = input.files[0];
            if (!file || !currentEditingEvidenceList || !currentEditingEvidenceList[index]) return;
            const ev = currentEditingEvidenceList[index];

            // Generate unique file ID
            const fileId = 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            const type = inferFileType(file.name);

            try {
                // Read file as ArrayBuffer
                const buffer = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                });

                // Store in IndexedDB (always, as fallback)
                await EvidenceDB.put(fileId, {
                    name: file.name,
                    type: file.type,
                    size: file.size,
                    buffer: buffer
                });

                // Also save to local evidence folder if available
                const oplId = document.getElementById('editOPLId').value;
                const savedToFolder = await EvidenceFolder.writeFile(oplId, fileId, file.name, buffer);
                if (savedToFolder) {
                    ev._inFolder = true;
                }

                // For images, also create a data URL for preview
                let dataUrl = '';
                if (type === 'image') {
                    dataUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                }

                // Clean up old file from IndexedDB and folder if exists
                if (ev.fileId) {
                    await EvidenceDB.remove(ev.fileId).catch(() => {});
                    if (ev._inFolder) {
                        await EvidenceFolder.deleteFile(oplId, ev.fileId, ev.name || '').catch(() => {});
                    }
                }

                // Update evidence entry
                ev.name = ev.name || file.name;
                ev.type = type;
                ev.fileId = fileId;
                ev.fileSize = file.size;
                ev.dataUrl = dataUrl;
                if (!ev.url) ev.url = '';

                input.value = ''; // Reset file input
                renderEditEvidenceList();
                showToast(`已上传: ${file.name}${savedToFolder ? ' (已保存到证据文件夹)' : ''}`);
            } catch (err) {
                console.error('File upload error:', err);
                showToast('文件上传失败: ' + err.message);
            }
        }

        function addEditEvidence() {
            currentEditingEvidenceList.push({ name: '', type: 'other', url: '', remark: '', fileId: '', dataUrl: '', fileSize: 0, _inFolder: false });

        async function removeEditEvidence(index) {
            const ev = currentEditingEvidenceList[index];
            // Clean up IndexedDB entry and folder file
            if (ev && ev.fileId) {
                await EvidenceDB.remove(ev.fileId).catch(() => {});
                if (ev._inFolder) {
                    const oplId = document.getElementById('editOPLId').value;
                    await EvidenceFolder.deleteFile(oplId, ev.fileId, ev.name || '').catch(() => {});
