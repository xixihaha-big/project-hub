<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMU代工厂管理</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #6366f1;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-layout { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #1e293b;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
        }

        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header .logo {
            width: 32px; height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }

        .sidebar-nav { flex: 1; padding: 12px; }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 8px;
            cursor: pointer; font-size: 14px;
            transition: all 0.15s; color: #cbd5e1;
            margin-bottom: 4px;
        }

        .nav-item:hover { background: #334155; color: #fff; }
        .nav-item.active { background: var(--primary); color: #fff; font-weight: 500; }
        .nav-item .icon { width: 20px; text-align: center; font-size: 15px; }
        .nav-item .badge-count {
            margin-left: auto;
            background: rgba(255,255,255,0.15);
            padding: 1px 7px; border-radius: 10px; font-size: 11px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #334155;
            font-size: 12px; color: #64748b;
        }

        /* Main Content */
        .main-content { flex: 1; margin-left: 240px; display: flex; flex-direction: column; }

        .topbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }

        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .topbar-left h2 { font-size: 18px; font-weight: 600; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }

        .page-content { padding: 24px 32px; flex: 1; }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between;
        }

        .card-title { font-size: 15px; font-weight: 600; }
        .card-body { padding: 20px; }

        /* Buttons */
        .btn {
            padding: 8px 16px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card-bg);
            cursor: pointer; font-size: 13px; font-weight: 500;
            transition: all 0.15s;
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text);
        }

        .btn:hover { border-color: var(--primary); color: var(--primary); }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
        .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
        .btn-success:hover { opacity: 0.9; color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-danger:hover { opacity: 0.9; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-ghost { border: none; background: none; color: var(--text-secondary); }
        .btn-ghost:hover { color: var(--primary); background: var(--primary-light); }

        /* Badges */
        .badge {
            padding: 3px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 600;
            display: inline-block;
        }

        .badge-high, .badge-danger { background: var(--danger-light); color: var(--danger); }
        .badge-medium, .badge-warning { background: var(--warning-light); color: #b45309; }
        .badge-low, .badge-info { background: var(--info-light); color: var(--info); }
        .badge-open { background: var(--warning-light); color: #b45309; }
        .badge-inprogress { background: var(--info-light); color: var(--info); }
        .badge-closed { background: var(--success-light); color: #047857; }
        .badge-overdue { background: var(--danger-light); color: var(--danger); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px; margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .stat-card.warning { border-left: 4px solid var(--warning); }
        .stat-card.danger { border-left: 4px solid var(--danger); }
        .stat-card.success { border-left: 4px solid var(--success); }
        .stat-card.info { border-left: 4px solid var(--info); }

        .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-detail { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        /* Tables */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; background: #f8fafc; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border); font-size: 12px; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
        tr:hover td { background: #f8fafc; }

        .owner-tag {
            background: var(--primary-light); color: var(--primary);
            padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;
        }

        /* Filter bar */
        .filter-bar {
            display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            padding: 7px 12px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 13px;
            background: var(--card-bg);
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px; width: 90%; max-width: 520px;
            max-height: 85vh; overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-wide { max-width: 750px; }

        .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 13px; font-family: inherit;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }

        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-light); }

        /* Meeting cards */
        .meeting-list-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .meeting-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 16px; cursor: pointer;
            transition: all 0.15s;
        }

        .meeting-card:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); }
        .meeting-card .mc-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .meeting-card .mc-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; }
        .meeting-card .mc-followups { font-size: 12px; color: var(--primary); margin-top: 8px; }

        /* Meeting detail */
        .meeting-detail-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
        }

        .followup-timeline { }
        .followup-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .followup-item:last-child { border-bottom: none; }
        .fi-date { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .fi-notes { font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
        .fi-attendees { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: #1e293b; color: #fff;
            padding: 12px 20px; border-radius: 8px;
            font-size: 13px; z-index: 9999;
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }

        /* Empty State */
        .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
        .empty-state .es-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .empty-state .es-title { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .empty-state .es-desc { font-size: 13px; }

        /* Minutes textarea */
        .minutes-textarea { min-height: 200px; font-size: 13px; line-height: 1.7; }

        .parsed-section-title {
            font-size: 14px; font-weight: 600; margin-bottom: 10px;
            padding-bottom: 6px; border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; gap: 8px;
        }

        .parsed-section-title .count-badge {
            background: var(--primary-light); color: var(--primary);
            padding: 2px 8px; border-radius: 10px; font-size: 11px;
        }

        .extracted-card {
            background: #f8fafc; border: 1px solid var(--border-light);
            border-radius: var(--radius-sm); padding: 12px 14px;
            margin-bottom: 10px; position: relative;
        }

        .extracted-card .ec-desc { font-size: 13px; font-weight: 500; margin-bottom: 8px; padding-right: 30px; }
        .extracted-card .ec-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .extracted-card .ec-fields .ec-field { display: flex; flex-direction: column; gap: 3px; }
        .extracted-card .ec-fields .ec-field label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .extracted-card .ec-fields .ec-field input,
        .extracted-card .ec-fields .ec-field select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; background: #fff; }

        .extracted-card .ec-remove {
            position: absolute; top: 10px; right: 10px;
            background: none; border: none; color: var(--danger);
            cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px;
        }
        .extracted-card .ec-remove:hover { background: var(--danger-light); }

        .minutes-step { display: none; }
        .minutes-step.active { display: block; }

        .parse-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

        /* Minutes record display */
        .minutes-content-box {
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .page-content { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><span class="logo">B</span> BMU代工厂管理</h1>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active" onclick="navigateTo('dashboard')">
                    <span class="icon">&#9632;</span> 仪表盘
                </div>
                <div class="nav-item" onclick="navigateTo('meetings')">
                    <span class="icon">&#128197;</span> 会议
                    <span class="badge-count" id="meetingCount">0</span>
                </div>
                <div class="nav-item" onclick="navigateTo('opl')">
                    <span class="icon">&#9888;</span> 问题清单
                    <span class="badge-count" id="oplCount">0</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                数据本地保存 &middot; BMU代工厂管理 v2.5
            </div>
        </aside>

        <!-- Main -->
        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <h2 id="pageTitle">仪表盘</h2>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-sm" onclick="exportCSV()">导出 CSV</button>
                    <button class="btn btn-success btn-sm" onclick="openMinutesUpload()">上传会议纪要</button>
                    <button class="btn btn-primary btn-sm" onclick="openModal('opl')">+ 新建问题</button>
                </div>
            </header>

            <!-- Page: Dashboard -->
            <div class="page-content" id="page-dashboard">
                <div class="stats-grid" id="dashboardStats"></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="card">
                        <div class="card-header"><span class="card-title">最近动态</span></div>
                        <div class="card-body" id="recentActivity"></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">逾期问题</span></div>
                        <div class="card-body" id="overdueItems"></div>
                    </div>
                </div>
            </div>

            <!-- Page: Meetings -->
            <div class="page-content" id="page-meetings" style="display:none;">
                <div class="filter-bar">
                    <input type="text" placeholder="搜索会议..." id="meetingSearch" oninput="renderMeetings()">
                    <button class="btn btn-primary" onclick="openModal('meeting')">+ 新建会议主题</button>
                </div>
                <div class="meeting-list-grid" id="meetingListGrid"></div>
                <div id="meetingDetailView" style="display:none;"></div>
            </div>

            <!-- Page: OPL -->
            <div class="page-content" id="page-opl" style="display:none;">
                <div class="stats-grid" id="oplStats"></div>
                <!-- Tab switcher -->
                <div style="display:flex; gap:0; margin-bottom:20px; border-bottom:2px solid var(--border);">
                    <div class="opl-tab active" id="oplTabOpen" onclick="switchOPLTab('open')" style="padding:10px 20px; cursor:pointer; font-size:14px; font-weight:600; border-bottom:2px solid var(--primary); margin-bottom:-2px; color:var(--primary);">
                        进行中 <span id="oplTabOpenCount" style="background:var(--warning-light);color:#b45309;padding:1px 7px;border-radius:10px;font-size:11px;margin-left:4px;">0</span>
                    </div>
                    <div class="opl-tab" id="oplTabClosed" onclick="switchOPLTab('closed')" style="padding:10px 20px; cursor:pointer; font-size:14px; font-weight:500; color:var(--text-muted); margin-bottom:-2px;">
                        已关闭存档 <span id="oplTabClosedCount" style="background:var(--success-light);color:#047857;padding:1px 7px;border-radius:10px;font-size:11px;margin-left:4px;">0</span>
                    </div>
                </div>
                <!-- Active OPL (Open / In Progress) -->
                <div class="card" id="oplActiveCard">
                    <div class="card-header">
                        <span class="card-title">待处理 / 进行中</span>
                        <button class="btn btn-primary btn-sm" onclick="openModal('opl')">+ 新建问题</button>
                    </div>
                    <div class="card-body">
                        <div class="filter-bar">
                            <input type="text" placeholder="搜索..." id="oplSearch" oninput="renderOPL()">
                            <select id="oplStatusFilter" onchange="renderOPL()">
                                <option value="">所有状态</option>
                                <option value="Open">待处理</option>
                                <option value="In Progress">进行中</option>
                            </select>
                            <select id="oplPriorityFilter" onchange="renderOPL()">
                                <option value="">所有优先级</option>
                                <option value="High">高</option>
                                <option value="Medium">中</option>
                                <option value="Low">低</option>
                            </select>
                        </div>
                        <div class="table-container" id="oplTable"></div>
                    </div>
                </div>
                <!-- Archived OPL (Closed) -->
                <div class="card" id="oplClosedCard" style="display:none;">
                    <div class="card-header">
                        <span class="card-title">已关闭存档</span>
                        <span style="font-size:12px; color:var(--text-muted);">已完成的问题项归档记录</span>
                    </div>
                    <div class="card-body">
                        <div class="filter-bar">
                            <input type="text" placeholder="搜索已关闭问题..." id="oplClosedSearch" oninput="renderOPL()">
                        </div>
                        <div class="table-container" id="oplClosedTable"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->

    <!-- New Meeting Modal -->
    <div class="modal-overlay" id="meetingModal">
        <div class="modal">
            <h3>新建会议主题</h3>
            <div class="form-group">
                <label>会议名称 *</label>
                <input type="text" id="meetingName" placeholder="例如 每周APQP评审">
            </div>
            <div class="form-group">
                <label>频率</label>
                <select id="meetingFrequency">
                    <option value="weekly">每周</option>
                    <option value="biweekly">每两周</option>
                    <option value="monthly">每月</option>
                    <option value="adhoc">临时</option>
                </select>
            </div>
            <div class="form-group">
                <label>飞书文档链接</label>
                <input type="url" id="meetingDocUrl" placeholder="https://mi-p.feishu.cn/docx/...">
            </div>
            <div class="form-group">
                <label>参与部门</label>
                <input type="text" id="meetingDepts" placeholder="逗号分隔，例如 EE, ME, DQE">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('meeting')">取消</button>
                <button class="btn btn-primary" onclick="createMeeting()">创建</button>
            </div>
        </div>
    </div>

    <!-- New OPL Modal -->
    <div class="modal-overlay" id="oplModal">
        <div class="modal">
            <h3>新建问题项</h3>
            <div class="form-group">
                <label>描述 *</label>
                <textarea id="oplDesc" placeholder="描述问题..."></textarea>
            </div>
            <div class="form-group">
                <label>类别</label>
                <select id="oplCategory">
                    <option value="Design">设计</option>
                    <option value="Process">工艺</option>
                    <option value="Material">材料</option>
                    <option value="Quality">质量</option>
                    <option value="Test">测试</option>
                    <option value="Production">生产</option>
                    <option value="Supply Chain">供应链</option>
                    <option value="Other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>负责人 *</label>
                <input type="text" id="oplOwner" placeholder="负责人姓名">
            </div>
            <div class="form-group">
                <label>截止日期 *</label>
                <input type="date" id="oplDueDate">
            </div>
            <div class="form-group">
                <label>优先级</label>
                <select id="oplPriority">
                    <option value="High">高</option>
                    <option value="Medium" selected>中</option>
                    <option value="Low">低</option>
                </select>
            </div>
            <div class="form-group">
                <label>行动方案</label>
                <textarea id="oplAction" placeholder="解决方案..."></textarea>
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('opl')">取消</button>
                <button class="btn btn-primary" onclick="createOPL()">创建</button>
            </div>
        </div>
    </div>

    <!-- Edit OPL Modal -->
    <div class="modal-overlay" id="editOPLModal">
        <div class="modal">
            <h3>编辑问题项</h3>
            <input type="hidden" id="editOPLId">
            <div class="form-group">
                <label>描述 *</label>
                <textarea id="editOPLDesc" placeholder="描述问题..."></textarea>
            </div>
            <div class="form-group">
                <label>类别</label>
                <select id="editOPLCategory">
                    <option value="Design">设计</option>
                    <option value="Process">工艺</option>
                    <option value="Material">材料</option>
                    <option value="Quality">质量</option>
                    <option value="Test">测试</option>
                    <option value="Production">生产</option>
                    <option value="Supply Chain">供应链</option>
                    <option value="Other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>负责人 *</label>
                <input type="text" id="editOPOwner" placeholder="负责人姓名">
            </div>
            <div class="form-group">
                <label>截止日期</label>
                <input type="date" id="editOPLDueDate">
            </div>
            <div class="form-group">
                <label>优先级</label>
                <select id="editOPLPriority">
                    <option value="High">高</option>
                    <option value="Medium">中</option>
                    <option value="Low">低</option>
                </select>
            </div>
            <div class="form-group">
                <label>行动方案</label>
                <textarea id="editOPLAction" placeholder="解决方案..."></textarea>
            </div>
            <div class="form-group" id="editClosedAtGroup" style="display:none;">
                <label>实际完成日期</label>
                <input type="date" id="editOPLClosedAt">
                <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">修改后会影响按时完成率统计</div>
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('editOPL')">取消</button>
                <button class="btn btn-primary" onclick="saveOPL()">保存修改</button>
            </div>
        </div>
    </div>

    <!-- Follow-up Modal -->
    <div class="modal-overlay" id="followupModal">
        <div class="modal">
            <h3>添加跟进会议</h3>
            <div class="form-group">
                <label>日期 *</label>
                <input type="date" id="followupDate">
            </div>
            <div class="form-group">
                <label>参会人员</label>
                <input type="text" id="followupAttendees" placeholder="逗号分隔姓名">
            </div>
            <div class="form-group">
                <label>会议记录</label>
                <textarea id="followupNotes" placeholder="会议内容..." style="min-height:150px;"></textarea>
            </div>
            <input type="hidden" id="followupMeetingId">
            <div class="form-actions">
                <button class="btn" onclick="closeModal('followup')">取消</button>
                <button class="btn btn-primary" onclick="createFollowup()">保存</button>
            </div>
        </div>
    </div>

    <!-- Minutes Upload Modal -->
    <div class="modal-overlay" id="minutesUploadModal">
        <div class="modal modal-wide">
            <h3>上传会议纪要</h3>

            <!-- Step 1: Input -->
            <div class="minutes-step active" id="minutesStep1">
                <div class="form-group">
                    <label>会议主题 *</label>
                    <select id="minutesMeeting">
                        <option value="">选择已有会议主题...</option>
                    </select>
                    <input type="text" id="minutesNewMeeting" placeholder="或输入新的会议主题名称" style="margin-top:6px;">
                </div>
                <div class="form-group">
                    <label>会议日期 *</label>
                    <input type="date" id="minutesDate">
                </div>
                <div class="form-group">
                    <label>会议纪要 * <span style="font-weight:normal; font-size:12px; color:var(--text-muted);">（粘贴飞书链接 或 文档内容）</span></label>
                    <div id="feishuUrlWarning" style="display:none; margin-bottom:10px; padding:12px 16px; background:#fff3cd; border:1px solid #ffc107; border-radius:8px; font-size:13px; color:#856404;">
                    </div>
                    <div id="feishuLoadSuccess" style="display:none; margin-bottom:10px; padding:12px 16px; background:var(--success-light); border:1px solid var(--success); border-radius:8px; font-size:13px; color:#047857;">
                        <strong>✅ 已从飞书实时加载文档内容！</strong> 直接点击「智能解析」即可。
                    </div>
                    <textarea id="minutesContent" class="minutes-textarea" placeholder="粘贴飞书文档链接，系统自动实时获取内容并解析&#10;&#10;支持任意飞书文档链接（无需预先缓存）：&#10;https://mi.feishu.cn/docx/xxxxxx&#10;&#10;也可以直接粘贴文档内容。"></textarea>
                    <div class="parse-hint">💡 粘贴任意飞书文档链接即可实时获取内容，无需预先缓存。也支持直接粘贴文档内容。</div>
                </div>
                <div class="form-actions">
                    <button class="btn" onclick="closeModal('minutesUpload')">取消</button>
                    <button class="btn btn-primary" onclick="parseMinutes()">智能解析</button>
                </div>
            </div>

            <!-- Step 2: Preview & Confirm -->
            <div class="minutes-step" id="minutesStep2">
                <div class="parsed-results" id="parsedResults"></div>
                <div class="form-actions">
                    <button class="btn" onclick="backToMinutesInput()">返回修改</button>
                    <button class="btn" onclick="closeModal('minutesUpload')">取消</button>
                    <button class="btn btn-primary" onclick="confirmMinutesImport()">确认添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== Data Store ====================
        let store = {
            meetings: [],
            opls: [],
            activities: []
        };

        let currentPage = 'dashboard';
        let currentMeetingDetail = null;

        // ==================== Display Helpers ====================
        function statusCN(s) {
            const map = {'Open':'待处理','In Progress':'进行中','Closed':'已关闭','Overdue':'已逾期'};
            return map[s] || s;
        }
        function priorityCN(p) {
            const map = {'High':'高','Medium':'中','Low':'低'};
            return map[p] || p;
        }
        function categoryCN(c) {
            const map = {'Design':'设计','Process':'工艺','Material':'材料','Quality':'质量','Test':'测试','Production':'生产','Other':'其他','Supply Chain':'供应链'};
            return map[c] || c;
        }
        function frequencyCN(f) {
            const map = {'weekly':'每周','biweekly':'每两周','monthly':'每月','adhoc':'临时'};
            return map[f] || f;
        }

        // ==================== Persistence ====================
        const DATA_VERSION = 'v6-bmu-clean';
        function loadStore() {
            const ver = localStorage.getItem('project-hub-version');
            if (ver !== DATA_VERSION) {
                localStorage.removeItem('project-hub-data');
                localStorage.setItem('project-hub-version', DATA_VERSION);
                initSampleData();
                return;
            }
            const saved = localStorage.getItem('project-hub-data');
            if (saved) {
                store = JSON.parse(saved);
            } else {
                initSampleData();
            }
        }

        function saveStore() {
            localStorage.setItem('project-hub-data', JSON.stringify(store));
        }

        function initSampleData() {
            store.meetings = [];
            store.opls = [];
            store.activities = [];
            saveStore();
        }

        // ==================== Navigation ====================
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.page-content').forEach(p => p.style.display = 'none');
            document.getElementById('page-' + page).style.display = 'block';

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event && event.target && event.target.closest('.nav-item') && event.target.closest('.nav-item').classList.add('active');

            const titles = { dashboard: '仪表盘', meetings: '会议', opl: '问题清单' };
            document.getElementById('pageTitle').textContent = titles[page] || page;

            if (page === 'dashboard') renderDashboard();
            else if (page === 'meetings') { renderMeetings(); document.getElementById('meetingDetailView').style.display = 'none'; document.getElementById('meetingListGrid').style.display = 'grid'; }
            else if (page === 'opl') renderOPL();
        }

        // ==================== Dashboard ====================
        function renderDashboard() {
            const openOPL = store.opls.filter(o => o.status !== 'Closed').length;
            const overdueOPL = store.opls.filter(o => o.status !== 'Closed' && new Date(o.dueDate) < new Date()).length;
            const totalMeetings = store.meetings.reduce((sum, m) => sum + m.followups.length, 0);
            const thisWeek = store.opls.filter(o => {
                const d = new Date(o.createdAt);
                const now = new Date();
                const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
                return d >= weekAgo;
            }).length;

            document.getElementById('dashboardStats').innerHTML = `
                <div class="stat-card info">
                    <div class="stat-label">待解决问题</div>
                    <div class="stat-value">${openOPL}</div>
                    <div class="stat-detail">${store.opls.length} 项总计</div>
                </div>
                <div class="stat-card ${overdueOPL > 0 ? 'danger' : 'success'}">
                    <div class="stat-label">已逾期</div>
                    <div class="stat-value">${overdueOPL}</div>
                    <div class="stat-detail">项已超过截止日期</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">会议记录</div>
                    <div class="stat-value">${totalMeetings}</div>
                    <div class="stat-detail">${store.meetings.length} 个会议主题</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-label">本周新增</div>
                    <div class="stat-value">${thisWeek}</div>
                    <div class="stat-detail">个新问题项</div>
                </div>
            `;

            // Recent activity
            const actHtml = store.activities.slice(0, 8).map(a => `
                <div style="display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-light);">
                    <span style="font-size:11px; color:var(--text-muted); white-space:nowrap; min-width:110px;">${a.time}</span>
                    <span style="font-size:13px;">${a.content}</span>
                </div>
            `).join('');
            document.getElementById('recentActivity').innerHTML = actHtml || '<div class="empty-state"><div class="es-desc">暂无动态</div></div>';

            // Overdue
            const overdueItems = store.opls.filter(o => o.status !== 'Closed' && new Date(o.dueDate) < new Date());
            const overdueHtml = overdueItems.slice(0, 6).map(item => `
                <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-light);">
                    <span class="badge badge-overdue">${item.id}</span>
                    <span style="font-size:13px; flex:1;">${item.desc}</span>
                    <span class="owner-tag">${item.owner}</span>
                    <span style="font-size:11px; color:var(--danger);">${item.dueDate}</span>
                </div>
            `).join('');
            document.getElementById('overdueItems').innerHTML = overdueHtml || '<div class="empty-state"><div class="es-desc">暂无逾期项</div></div>';

            updateCounts();
        }

        function updateCounts() {
            document.getElementById('meetingCount').textContent = store.meetings.length;
            document.getElementById('oplCount').textContent = store.opls.filter(o => o.status !== 'Closed').length;
        }

        // ==================== Meetings ====================
        function renderMeetings() {
            const search = (document.getElementById('meetingSearch').value || '').toLowerCase();
            let filtered = store.meetings;
            if (search) filtered = filtered.filter(m => m.name.toLowerCase().includes(search));

            const html = filtered.map(m => `
                <div class="meeting-card" onclick="showMeetingDetail('${m.id}')">
                    <div class="mc-title">${m.name}</div>
                    <div class="mc-meta">
                        <span>&#128197; ${frequencyCN(m.frequency)}</span>
                        <span>&#128101; ${(m.depts || []).join(', ')}</span>
                    </div>
                    ${m.followups.length > 0 ? `<div class="mc-followups">&#128196; ${m.followups.length} 次会议记录</div>` : ''}
                </div>
            `).join('');

            document.getElementById('meetingListGrid').innerHTML = html || '<div class="empty-state"><div class="es-icon">&#128197;</div><div class="es-title">暂无会议</div><div class="es-desc">创建会议主题来跟踪代工厂沟通</div></div>';
        }

        function showMeetingDetail(id) {
            const m = store.meetings.find(x => x.id === id);
            if (!m) return;
            currentMeetingDetail = id;

            document.getElementById('meetingListGrid').style.display = 'none';
            const detailEl = document.getElementById('meetingDetailView');
            detailEl.style.display = 'block';

            const followupsHtml = m.followups.length > 0
                ? `<div class="followup-timeline">${m.followups.map(f => `
                    <div class="followup-item">
                        <div class="fi-date">&#128197; ${f.date} ${f.attendees ? ' &nbsp;&#128101; ' + f.attendees : ''}</div>
                        <div class="minutes-content-box">${escapeHtml(f.notes || '暂无记录')}</div>
                    </div>
                `).join('')}</div>`
                : '<div class="empty-state"><div class="es-desc">暂无会议记录</div></div>';

            detailEl.innerHTML = `
                <div class="meeting-detail-header">
                    <button class="btn btn-ghost" onclick="backToMeetingList()">&#8592; 返回</button>
                    <h3 style="font-size:18px; font-weight:600;">${m.name}</h3>
                    <span class="badge badge-inprogress">${frequencyCN(m.frequency)}</span>
                </div>
                <div style="display:grid; grid-template-columns:2fr 1fr; gap:20px;">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">会议记录</span>
                            <button class="btn btn-sm btn-primary" onclick="openFollowupModal('${m.id}')">+ 添加记录</button>
                        </div>
                        <div class="card-body">${followupsHtml}</div>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">会议信息</span></div>
                        <div class="card-body">
                            <div style="font-size:13px; margin-bottom:10px;"><strong>频率：</strong> ${frequencyCN(m.frequency)}</div>
                            <div style="font-size:13px; margin-bottom:10px;"><strong>参与部门：</strong> ${(m.depts || []).join(', ') || '未设置'}</div>
                            <div style="font-size:13px; margin-bottom:10px;"><strong>创建时间：</strong> ${m.createdAt}</div>
                            <div style="font-size:13px; margin-bottom:10px;"><strong>累计记录：</strong> ${m.followups.length} 次</div>
                            ${m.docUrl ? `<div style="font-size:13px;"><strong>文档：</strong> <a href="${m.docUrl}" target="_blank" style="color:var(--primary);">在飞书中打开</a></div>` : ''}
                            <hr style="margin:16px 0; border:none; border-top:1px solid var(--border-light);">
                            <button class="btn btn-danger btn-sm" onclick="deleteMeeting('${m.id}')">删除会议</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function backToMeetingList() {
            document.getElementById('meetingDetailView').style.display = 'none';
            document.getElementById('meetingListGrid').style.display = 'grid';
            currentMeetingDetail = null;
        }

        // ==================== OPL ====================
        let oplCurrentTab = 'open'; // 'open' or 'closed'

        function switchOPLTab(tab) {
            oplCurrentTab = tab;
            const tabOpen = document.getElementById('oplTabOpen');
            const tabClosed = document.getElementById('oplTabClosed');
            const cardActive = document.getElementById('oplActiveCard');
            const cardClosed = document.getElementById('oplClosedCard');
            if (tab === 'open') {
                tabOpen.style.borderBottom = '2px solid var(--primary)';
                tabOpen.style.color = 'var(--primary)';
                tabOpen.style.fontWeight = '600';
                tabClosed.style.borderBottom = '2px solid transparent';
                tabClosed.style.color = 'var(--text-muted)';
                tabClosed.style.fontWeight = '500';
                cardActive.style.display = 'block';
                cardClosed.style.display = 'none';
            } else {
                tabClosed.style.borderBottom = '2px solid var(--success)';
                tabClosed.style.color = '#047857';
                tabClosed.style.fontWeight = '600';
                tabOpen.style.borderBottom = '2px solid transparent';
                tabOpen.style.color = 'var(--text-muted)';
                tabOpen.style.fontWeight = '500';
                cardActive.style.display = 'none';
                cardClosed.style.display = 'block';
            }
            renderOPL();
        }

        function renderOPL() {
            const search = (document.getElementById('oplSearch').value || '').toLowerCase();
            const statusFilter = document.getElementById('oplStatusFilter').value;
            const priorityFilter = document.getElementById('oplPriorityFilter').value;
            const closedSearch = (document.getElementById('oplClosedSearch')?.value || '').toLowerCase();

            // Split into active and closed
            const activeOPLs = store.opls.filter(o => o.status !== 'Closed');
            const closedOPLs = store.opls.filter(o => o.status === 'Closed');

            // Stats (always show totals)
            const total = store.opls.length;
            const open = store.opls.filter(o => o.status === 'Open').length;
            const inProg = store.opls.filter(o => o.status === 'In Progress').length;
            const closed = closedOPLs.length;
            const overdue = activeOPLs.filter(o => o.dueDate && new Date(o.dueDate) < new Date()).length;
            const onTime = closedOPLs.filter(o => o.closedAt && o.dueDate && new Date(o.closedAt) <= new Date(o.dueDate)).length;
            const onTimeRate = closed > 0 ? Math.round(onTime / closed * 100) : '-';

            document.getElementById('oplStats').innerHTML = `
                <div class="stat-card"><div class="stat-label">总计</div><div class="stat-value">${total}</div></div>
                <div class="stat-card warning"><div class="stat-label">待处理</div><div class="stat-value">${open}</div></div>
                <div class="stat-card info"><div class="stat-label">进行中</div><div class="stat-value">${inProg}</div></div>
                <div class="stat-card ${overdue > 0 ? 'danger' : 'success'}"><div class="stat-label">已逾期</div><div class="stat-value">${overdue}</div></div>
                <div class="stat-card success"><div class="stat-label">已关闭</div><div class="stat-value">${closed}</div></div>
                <div class="stat-card"><div class="stat-label">按时完成率</div><div class="stat-value">${onTimeRate}${onTimeRate !== '-' ? '%' : ''}</div></div>
            `;

            // Update tab counts
            document.getElementById('oplTabOpenCount').textContent = activeOPLs.length;
            document.getElementById('oplTabClosedCount').textContent = closedOPLs.length;

            // ---- Render Active OPL Table ----
            let filteredActive = activeOPLs;
            if (search) filteredActive = filteredActive.filter(o => o.desc.toLowerCase().includes(search) || o.owner.toLowerCase().includes(search));
            if (statusFilter) filteredActive = filteredActive.filter(o => o.status === statusFilter);
            if (priorityFilter) filteredActive = filteredActive.filter(o => o.priority === priorityFilter);

            const activeRows = filteredActive.map(o => {
                const statusClass = o.status === 'In Progress' ? 'inprogress' : o.status.toLowerCase();
                const priorityClass = o.priority.toLowerCase();
                const isOverdue = o.dueDate && new Date(o.dueDate) < new Date();
                const extCount = (o.extensions && o.extensions.length) || 0;
                let dueDateDisplay = '';
                if (isOverdue) {
                    const days = Math.ceil((new Date() - new Date(o.dueDate)) / (1000*60*60*24));
                    dueDateDisplay = `<span style="color:var(--danger); font-weight:600;">${o.dueDate}</span><br><span style="font-size:11px; color:var(--danger);">逾期${days}天</span>`;
                } else {
                    dueDateDisplay = o.dueDate || '<span style="color:var(--text-muted);">未设置</span>';
                }
                if (extCount > 0) dueDateDisplay += `<br><span style="font-size:10px; color:var(--warning);">已延期${extCount}次</span>`;
                return `<tr>
                    <td><strong>${o.id}</strong></td>
                    <td style="max-width:280px;">${o.desc}</td>
                    <td>${categoryCN(o.category)}</td>
                    <td><span class="owner-tag">${o.owner}</span></td>
                    <td style="min-width:100px;">${dueDateDisplay}</td>
                    <td><span class="badge badge-${priorityClass}">${priorityCN(o.priority)}</span></td>
                    <td><span class="badge badge-${statusClass}">${statusCN(o.status)}</span></td>
                    <td>
                        <select class="btn btn-sm" onchange="updateOPLStatus('${o.id}', this.value)" style="font-size:11px;padding:3px 6px;">
                            <option value="" disabled selected>操作</option>
                            <option value="edit">编辑</option>
                            <option value="Open">设为待处理</option>
                            <option value="In Progress">进行中</option>
                            <option value="Closed">关闭并存档</option>
                            <option value="延期">申请延期</option>
                            <option value="delete">删除</option>
                        </select>
                    </td>
                </tr>`;
            }).join('');

            document.getElementById('oplTable').innerHTML = `
                <table>
                    <thead><tr><th>编号</th><th>描述</th><th>类别</th><th>负责人</th><th>截止日期</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody>${activeRows || '<tr><td colspan="8"><div class="empty-state"><div class="es-desc">暂无待处理问题</div></div></td></tr>'}</tbody>
                </table>
            `;

            // ---- Render Closed/Archived OPL Table ----
            let filteredClosed = closedOPLs;
            if (closedSearch) filteredClosed = filteredClosed.filter(o => o.desc.toLowerCase().includes(closedSearch) || o.owner.toLowerCase().includes(closedSearch));

            const closedRows = filteredClosed.map(o => {
                const priorityClass = o.priority.toLowerCase();
                const extCount = (o.extensions && o.extensions.length) || 0;
                let dueDateDisplay = '';
                if (o.closedAt && o.dueDate) {
                    const onTimeFlag = new Date(o.closedAt) <= new Date(o.dueDate);
                    dueDateDisplay = `<span style="color:${onTimeFlag?'var(--success)':'var(--text-muted)'};">${o.dueDate}</span>`;
                    if (onTimeFlag) {
                        dueDateDisplay += `<br><span style="font-size:11px; color:var(--success);">✓ 按时完成</span>`;
                    } else {
                        dueDateDisplay += `<br><span style="font-size:11px; color:var(--warning);">实际完成：${o.closedAt}</span>`;
                    }
                } else {
                    dueDateDisplay = o.dueDate || '-';
                }
                if (extCount > 0) dueDateDisplay += `<br><span style="font-size:10px; color:var(--warning);">延期${extCount}次</span>`;
                return `<tr>
                    <td><strong>${o.id}</strong></td>
                    <td style="max-width:280px;">${o.desc}</td>
                    <td>${categoryCN(o.category)}</td>
                    <td><span class="owner-tag">${o.owner}</span></td>
                    <td style="min-width:100px;">${dueDateDisplay}</td>
                    <td><span class="badge badge-${priorityClass}">${priorityCN(o.priority)}</span></td>
                    <td><span style="font-size:12px; color:var(--text-muted);">${o.closedAt || '-'}</span></td>
                    <td>
                        <select class="btn btn-sm" onchange="updateOPLStatus('${o.id}', this.value)" style="font-size:11px;padding:3px 6px;">
                            <option value="" disabled selected>操作</option>
                            <option value="edit">编辑</option>
                            <option value="Open">重新打开</option>
                            <option value="delete">删除</option>
                        </select>
                    </td>
                </tr>`;
            }).join('');

            document.getElementById('oplClosedTable').innerHTML = `
                <table>
                    <thead><tr><th>编号</th><th>描述</th><th>类别</th><th>负责人</th><th>截止日期</th><th>优先级</th><th>关闭日期</th><th>操作</th></tr></thead>
                    <tbody>${closedRows || '<tr><td colspan="8"><div class="empty-state"><div class="es-desc">暂无已关闭问题</div></div></td></tr>'}</tbody>
                </table>
            `;
        }

        function updateOPLStatus(id, value) {
            if (value === 'edit') {
                editOPL(id);
                return;
            } else if (value === 'delete') {
                if (confirm('确定删除此问题项？')) {
                    store.opls = store.opls.filter(o => o.id !== id);
                    addActivity(`已删除 ${id}`);
                }
            } else if (value === '延期') {
                requestExtension(id);
                return;
            } else {
                const opl = store.opls.find(o => o.id === id);
                if (opl) {
                    const oldStatus = opl.status;
                    opl.status = value;
                    if (value === 'Closed') {
                        opl.closedAt = new Date().toISOString().split('T')[0];
                        const due = opl.dueDate ? new Date(opl.dueDate) : null;
                        const closed = new Date(opl.closedAt);
                        if (due && closed <= due) {
                            addActivity(`${id} 已按时关闭并存档（完成日期：${opl.closedAt}）`);
                        } else if (due) {
                            const days = Math.ceil((closed - due) / (1000*60*60*24));
                            addActivity(`${id} 已关闭并存档，逾期${days}天（截止：${opl.dueDate}，完成：${opl.closedAt}）`);
                        } else {
                            addActivity(`${id} 已关闭并存档（完成日期：${opl.closedAt}）`);
                        }
                        showToast(`${id} 已关闭，已移入「已关闭存档」`);
                    } else {
                        if (oldStatus === 'Closed') { opl.closedAt = ''; }
                        addActivity(`${id} 状态变更为${statusCN(value)}`);
                        if (oldStatus === 'Closed') {
                            showToast(`${id} 已重新打开，已移回「进行中」`);
                        }
                    }
                }
            }
            saveStore();
            renderOPL();
            updateCounts();
        }

        function requestExtension(id) {
            const opl = store.opls.find(o => o.id === id);
            if (!opl) return;
            const reason = prompt(`申请延期 ${id}\n当前截止日期：${opl.dueDate}\n\n请输入延期原因（必填）：`);
            if (!reason || !reason.trim()) { showToast('延期原因不能为空，已取消'); return; }
            const newDate = prompt(`请输入新的截止日期（格式：YYYY-MM-DD）：\n例如：2025-08-15`);
            if (!newDate || !/^\d{4}-\d{2}-\d{2}$/.test(newDate.trim())) { showToast('日期格式不正确，已取消'); return; }
            if (new Date(newDate) <= new Date(opl.dueDate)) { showToast('新日期必须晚于当前截止日期'); return; }
            const oldDate = opl.dueDate;
            opl.dueDate = newDate.trim();
            if (!opl.extensions) opl.extensions = [];
            opl.extensions.push({ from: oldDate, to: newDate.trim(), reason: reason.trim(), date: new Date().toISOString().split('T')[0] });
            addActivity(`${id} 申请延期：${oldDate} → ${newDate.trim()}（原因：${reason.trim()}）`);
            saveStore();
            renderOPL();
            updateCounts();
            showToast(`${id} 已延期至 ${newDate.trim()}`);
        }

        // Feishu API proxy endpoints (try in order: local dev server, then Vercel)
        const FEISHU_API_ENDPOINTS = [
            'http://localhost:3001/api/feishu-doc',
            'http://localhost:3000/api/feishu-doc',
            'https://feishu-proxy-bmu.vercel.app/api/feishu-doc'
        ];

        // Local cache for fetched documents (session-level, avoids redundant requests)
        const feishuSessionCache = {};

        // Extract feishu doc token from URL
        function extractFeishuToken(url) {
            const m = url.match(/feishu\.cn\/(?:docx|wiki|docs)\/([A-Za-z0-9]+)/);
            return m ? m[1] : null;
        }

        // Fetch feishu document content via API proxy (tries multiple endpoints)
        async function fetchFeishuDocument(url) {
            const token = extractFeishuToken(url);
            if (!token) throw new Error('无法从URL中提取文档ID');

            // Check session cache first
            if (feishuSessionCache[token]) {
                return feishuSessionCache[token];
            }

            let lastError = null;
            for (const endpoint of FEISHU_API_ENDPOINTS) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 8000);
                    const response = await fetch(`${endpoint}?url=${encodeURIComponent(url)}`, {
                        signal: controller.signal
                    });
                    clearTimeout(timeout);
                    const data = await response.json();

                    if (data.success) {
                        // Cache in session
                        feishuSessionCache[token] = data;
                        return data;
                    } else {
                        lastError = new Error(data.error || '获取文档失败');
                    }
                } catch (e) {
                    lastError = e;
                    // Try next endpoint
                    continue;
                }
            }

            throw lastError || new Error('所有API端点均不可用，请启动本地代理服务');
        }

        async function parseMinutes() {
            const meetingId = document.getElementById('minutesMeeting').value;
            const newMeetingName = document.getElementById('minutesNewMeeting').value.trim();
            const date = document.getElementById('minutesDate').value;
            let content = document.getElementById('minutesContent').value.trim();

            if (!meetingId && !newMeetingName) { showToast('请选择或输入会议主题'); return; }
            if (!date) { showToast('请选择会议日期'); return; }
            if (!content) { showToast('请粘贴会议纪要内容'); return; }

            // Detect if user pasted a feishu URL - fetch content in real-time
            if (/^https?:\/\/[^\s]*feishu\.cn\//.test(content) && content.split('\n').length <= 3 && content.length < 200) {
                // Show loading state and fetch
                showToast('正在从飞书获取文档内容...');
                try {
                    const data = await fetchFeishuDocument(content);
                    content = data.content;
                    document.getElementById('minutesContent').value = content;
                    document.getElementById('feishuLoadSuccess').style.display = 'block';
                    document.getElementById('feishuLoadSuccess').innerHTML = '✅ 已从飞书实时加载文档内容';
                    // Auto-fill title
                    if (data.title && !newMeetingName && !meetingId) {
                        document.getElementById('minutesNewMeeting').value = data.title;
                    }
                    showToast('✅ 文档内容加载成功，正在解析...');
                } catch (err) {
                    showToast('⚠️ 获取失败：' + err.message);
                    document.getElementById('feishuUrlWarning').innerHTML = `<strong>⚠️ 获取失败：${err.message}</strong><br><br>请手动复制文档内容粘贴到此处。`;
                    document.getElementById('feishuUrlWarning').style.display = 'block';
                    return;
                }
            }

            extractedOPLs = [];
            let cachedAttendees = extractedAttendees || '';
            extractedAttendees = '';

            // Extract attendees
            const attendeesPatterns = [/参会人员[：:]\s*(.+)/, /参会人[：:]\s*(.+)/, /与会人员[：:]\s*(.+)/, /出席[：:]\s*(.+)/];
            for (const pat of attendeesPatterns) {
                const m = content.match(pat);
                if (m) {
                    let raw = m[1];
                    const citeNames = [];
                    const citeRegex = /user-name="([^"]+)"/g;
                    let cm;
                    while ((cm = citeRegex.exec(raw)) !== null) citeNames.push(cm[1]);
                    raw = raw.replace(/<cite[^>]*><\/cite>/g, '').replace(/<[^>]+>/g, '');
                    const plainNames = raw.split(/[,，、\s]+/).map(n => n.replace(/\(外部\)|\（外部\）/g, '').trim()).filter(n => n && n.length >= 2 && n.length <= 10 && !/^\d/.test(n) && !/其他|名外部/.test(n));
                    extractedAttendees = [...citeNames, ...plainNames].filter((v, i, a) => a.indexOf(v) === i).join(', ');
                    break;
                }
            }
            // Fallback to cached attendees if extraction found nothing
            if (!extractedAttendees && cachedAttendees) extractedAttendees = cachedAttendees;

            // ===== NEW STRATEGY: Format-agnostic parsing =====
            // Strategy 1: Use regex to find ALL "标题：描述...@人名" patterns in the ENTIRE text
            // This works regardless of line breaks, formatting, or paste behavior
            const actionItemRegex = /([一-鿿A-Za-z0-9 .]{2,20}(?:料|获取|完善|补充|更新|整合|优化|报告|排产|催办|确认|跟进|推动|验证|提交|安排|评估|落实|处理|协调|对比|释放|清单))[：:]([^@\n]{5,150})@([一-鿿]{2,4}|说话人\d+|待定)/gm;
            let match;
            while ((match = actionItemRegex.exec(content)) !== null) {
                const title = match[1].trim();
                const description = match[2].trim();
                const owner = match[3].trim();
                const fullDesc = title + '：' + description;
                const parsed = parseItemContent(fullDesc + '@' + owner);
                if (parsed) extractedOPLs.push(parsed);
            }

            // Strategy 2: If Strategy 1 didn't find enough, try checkbox format (- [ ])
            if (extractedOPLs.length < 3) {
                const checkboxRegex = /[-*]\s*\[[\sx]*\]\s*(.+)/g;
                let cbMatch;
                while ((cbMatch = checkboxRegex.exec(content)) !== null) {
                    const itemText = cbMatch[1].trim();
                    if (itemText.length > 5 && !/由.*生成|可能不准确/.test(itemText)) {
                        const isDup = extractedOPLs.some(r => r.desc.includes(itemText.substring(0, 15)));
                        if (!isDup) {
                            const parsed = parseItemContent(itemText);
                            if (parsed) extractedOPLs.push(parsed);
                        }
                    }
                }
            }

            // Strategy 3: Section-based parsing (original approach but simplified)
            if (extractedOPLs.length < 3) {
                const lines = content.split('\n');
                let inTodoSection = false;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    // Detect todo section start (very broad)
                    if (/待办|行动项|Action|TODO/i.test(line) && line.length < 50) {
                        inTodoSection = true;
                        continue;
                    }
                    // Detect section end
                    if (inTodoSection && (/^#{1,3}\s/.test(line) || /^[🎉🧾🪜📋⚠️🔥💡📌]/.test(line) || /^(智能章节|补充内容)/.test(line))) {
                        inTodoSection = false;
                        continue;
                    }
                    if (inTodoSection) {
                        let itemText = line.replace(/^[-*•·☐□◻◯○]\s*/, '').replace(/^(\[[\sx]*\])\s*/, '').replace(/^\d+[.、)]\s*/, '').trim();
                        if (itemText.length > 5 && !/由.*生成|可能不准确|人工调整|点击此处|反馈群/.test(itemText)) {
                            const isDup = extractedOPLs.some(r => r.desc.includes(itemText.substring(0, 15)));
                            if (!isDup) {
                                const parsed = parseItemContent(itemText);
                                if (parsed) extractedOPLs.push(parsed);
                            }
                        }
                    }
                }
            }

            // Strategy 4: Find all lines with @Chinese_name (universal fallback)
            if (extractedOPLs.length < 3) {
                const lines = content.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line || line.length < 10 || line.length > 300) continue;
                    // Skip obvious headers and metadata
                    if (/^#{1,3}\s|^>|^会议|^参会|^提醒|^文字记录/.test(line)) continue;
                    if (/@[一-鿿]{2,4}/.test(line) && /[：:]/.test(line)) {
                        const cleanLine = line.replace(/^[-*•·\d.、)\[\]x☐□◻\s]*/, '').trim();
                        if (cleanLine.length > 8) {
                            const isDup = extractedOPLs.some(r => r.desc.includes(cleanLine.substring(0, 15)));
                            if (!isDup) {
                                const parsed = parseItemContent(cleanLine);
                                if (parsed) extractedOPLs.push(parsed);
                            }
                        }
                    }
                }
            }

            // Strategy 5: Keyword-based (last resort)
            if (extractedOPLs.length === 0) {
                const oplKws = ['需要解决', '待确认', '待解决', '需跟进', '缺失', '缺少', '未完成', '未提供', '催促', '需尽快', '推动', '协助'];
                const lines = content.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line || line.length < 8 || line.length > 300) continue;
                    if (/^#{1,3}\s/.test(line)) continue;
                    if (oplKws.some(kw => line.includes(kw))) {
                        const cleanLine = line.replace(/^[-*•·\d.、)]\s*/, '').replace(/\*\*/g, '').trim();
                        if (cleanLine.length > 5) {
                            const isDup = extractedOPLs.some(r => r.desc.includes(cleanLine.substring(0, 15)));
                            if (!isDup) {
                                const parsed = parseItemContent(cleanLine);
                                if (parsed) extractedOPLs.push(parsed);
                            }
                        }
                    }
                }
            }

            // Show results
            renderParsedResults();
            document.getElementById('minutesStep1').classList.remove('active');
            document.getElementById('minutesStep2').classList.add('active');
        }

        function parseItemContent(text) {
            let desc = text.trim();
            if (!desc || desc.length < 3) return null;

            desc = desc.replace(/\*\*/g, '');
            desc = desc.replace(/<cite[^>]*user-name="([^"]+)"[^>]*><\/cite>/g, '@$1');
            desc = desc.replace(/<[^>]+>/g, '');

            // Extract owner
            let owner = '';
            const ownerPatterns = [/@([一-鿿]{2,4})/, /@([^\s@,，;；。.\d]{2,10})/, /负责人[:：]\s*([^\s,，;；。.]+)/];
            for (const pat of ownerPatterns) {
                const m = desc.match(pat);
                if (m) {
                    owner = m[1];
                    desc = desc.replace(/@[一-鿿]{2,4}/g, '').replace(/@[^\s@,，;；。.\d]{2,10}/g, '').trim();
                    break;
                }
            }

            // Extract due date
            let dueDate = '';
            const datePatterns = [
                { re: /截止[:：]?\s*(\d{4}-\d{2}-\d{2})/, idx: 1, full: true },
                { re: /(\d{4}-\d{2}-\d{2})/, idx: 1, full: true },
                { re: /(\d{1,2})月(\d{1,2})[日号]前?/, idx: null, full: false }
            ];
            for (const dp of datePatterns) {
                const m = desc.match(dp.re);
                if (m) {
                    if (dp.full) { dueDate = m[dp.idx]; }
                    else if (m[1] && m[2]) {
                        const year = new Date().getFullYear();
                        dueDate = `${year}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
                    }
                    desc = desc.replace(m[0], '').trim();
                    break;
                }
            }

            // Priority
            let priority = 'Medium';
            if (/紧急|重要|高优先|尽快|立即/.test(text)) priority = 'High';
            else if (/低优先|不紧急|适时/.test(text)) priority = 'Low';

            // Category
            let category = 'Other';
            if (/设计|Design|BOM|原理图/i.test(text)) category = 'Design';
            else if (/工艺|Process|工装|治具|插件|贴片|焊接/i.test(text)) category = 'Process';
            else if (/材料|Material|物料|备料|来料|导热垫|电容/i.test(text)) category = 'Material';
            else if (/质量|Quality|AECQ|PPAP|合格/i.test(text)) category = 'Quality';
            else if (/测试|Test|验证|DVP|DV/i.test(text)) category = 'Test';
            else if (/生产|Production|排产|量产|产线/i.test(text)) category = 'Production';
            else if (/供应|供应商|采购|交付/i.test(text)) category = 'Supply Chain';

            desc = desc.replace(/[,，;；。]\s*$/, '').replace(/^\s*[:：]\s*/, '').replace(/\s{2,}/g, ' ').replace(/[。.]\s*$/, '').trim();
            if (!desc || desc.length < 3) return null;

            return { desc, owner, dueDate, priority, category };
        }

        function renderParsedResults() {
            let html = '';
            html += `<div class="parsed-section-title">识别到的问题项 (OPL) <span class="count-badge">${extractedOPLs.length} 项</span></div>`;

            if (extractedOPLs.length === 0) {
                const rawContent = document.getElementById('minutesContent').value.trim();
                const lineCount = rawContent.split('\n').length;
                const hasAt = /@/.test(rawContent);
                const hasColon = /[：:]/.test(rawContent);
                const firstLines = rawContent.split('\n').filter(l => l.trim()).slice(0, 8).map(l => l.substring(0, 80)).join('<br>');
                html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:16px; padding:20px; text-align:center;">未识别到问题项。会议纪要内容仍会完整保存为会议记录。<br><br><details><summary style="cursor:pointer;color:#888;">▶ 调试信息</summary><div style="text-align:left;margin-top:8px;font-size:11px;color:#999;word-break:break-all;">内容长度: ${rawContent.length} 字<br>行数: ${lineCount}<br>含@符号: ${hasAt}<br>含中文冒号: ${hasColon}<br>含 ✅: ${/✅/.test(rawContent)}<br>含待办: ${/待办/.test(rawContent)}<br>含 - [ ]: ${/- \\[ \\]/.test(rawContent)}<br><br>前8行内容:<br><code style="font-size:10px;">${firstLines}</code></div></details></div>`;
            } else {
                extractedOPLs.forEach((item, idx) => {
                    html += `
                    <div class="extracted-card">
                        <button class="ec-remove" onclick="removeExtractedItem(${idx})" title="移除">&times;</button>
                        <div class="ec-desc">
                            <input type="text" value="${escapeHtml(item.desc)}" onchange="extractedOPLs[${idx}].desc=this.value" style="width:100%; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:13px; font-weight:500;">
                        </div>
                        <div class="ec-fields">
                            <div class="ec-field">
                                <label>负责人</label>
                                <input type="text" value="${escapeHtml(item.owner)}" onchange="extractedOPLs[${idx}].owner=this.value" placeholder="未指定">
                            </div>
                            <div class="ec-field">
                                <label>截止日期（确认后锁定）</label>
                                <input type="date" value="${item.dueDate}" onchange="extractedOPLs[${idx}].dueDate=this.value">
                            </div>
                            <div class="ec-field">
                                <label>优先级</label>
                                <select onchange="extractedOPLs[${idx}].priority=this.value">
                                    <option value="High" ${item.priority==='High'?'selected':''}>高</option>
                                    <option value="Medium" ${item.priority==='Medium'?'selected':''}>中</option>
                                    <option value="Low" ${item.priority==='Low'?'selected':''}>低</option>
                                </select>
                            </div>
                            <div class="ec-field">
                                <label>类别</label>
                                <select onchange="extractedOPLs[${idx}].category=this.value">
                                    <option value="Design" ${item.category==='Design'?'selected':''}>设计</option>
                                    <option value="Process" ${item.category==='Process'?'selected':''}>工艺</option>
                                    <option value="Material" ${item.category==='Material'?'selected':''}>材料</option>
                                    <option value="Quality" ${item.category==='Quality'?'selected':''}>质量</option>
                                    <option value="Test" ${item.category==='Test'?'selected':''}>测试</option>
                                    <option value="Production" ${item.category==='Production'?'selected':''}>生产</option>
                                    <option value="Supply Chain" ${item.category==='Supply Chain'?'selected':''}>供应链</option>
                                    <option value="Other" ${item.category==='Other'?'selected':''}>其他</option>
                                </select>
                            </div>
                        </div>
                    </div>`;
                });
            }

            html += '<div style="margin-top:16px; padding:12px; background:var(--success-light); border-radius:var(--radius-sm); font-size:13px; color:#047857;">&#10003; 会议纪要全文将完整保存为会议记录。</div>';

            document.getElementById('parsedResults').innerHTML = html;
        }

        function removeExtractedItem(index) {
            extractedOPLs.splice(index, 1);
            renderParsedResults();
        }

        function backToMinutesInput() {
            document.getElementById('minutesStep2').classList.remove('active');
            document.getElementById('minutesStep1').classList.add('active');
        }

        function confirmMinutesImport() {
            let meetingId = document.getElementById('minutesMeeting').value;
            const newMeetingName = document.getElementById('minutesNewMeeting').value.trim();
            const date = document.getElementById('minutesDate').value;
            const content = document.getElementById('minutesContent').value.trim();

            // Create meeting if needed
            if (!meetingId && newMeetingName) {
                meetingId = 'M' + String(store.meetings.length + 1).padStart(3, '0');
                store.meetings.push({
                    id: meetingId, name: newMeetingName, docUrl: '', depts: [],
                    frequency: 'adhoc', createdAt: new Date().toISOString().split('T')[0], followups: []
                });
                addActivity(`创建了会议主题：${newMeetingName}`);
            }

            if (!meetingId) { showToast('请选择或创建会议主题'); return; }

            let oplCount = 0;

            // Add OPL items
            extractedOPLs.forEach(item => {
                if (!item.desc) return;
                const id = 'OPL-' + String(store.opls.length + 1).padStart(3, '0');
                store.opls.push({
                    id, desc: item.desc, category: item.category || 'Other',
                    owner: item.owner || '待指定', dueDate: item.dueDate || '',
                    priority: item.priority || 'Medium', status: 'Open',
                    action: '', createdAt: new Date().toISOString().split('T')[0],
                    closedAt: '', extensions: [],
                    source: '会议纪要导入'
                });
                oplCount++;
            });

            // Save FULL meeting minutes as followup (no truncation!)
            const meeting = store.meetings.find(m => m.id === meetingId);
            if (meeting) {
                const fid = 'F' + String(Date.now()).slice(-6);
                meeting.followups.unshift({
                    id: fid,
                    date: date,
                    notes: content,  // 全文保存，不截断
                    attendees: extractedAttendees || ''
                });
            }

            // Activity logs
            if (oplCount > 0) {
                addActivity(`从会议纪要导入了 ${oplCount} 个问题项`);
            }
            addActivity(`保存了会议记录（${meeting ? meeting.name : ''} ${date}）`);

            saveStore();
            closeModal('minutesUpload');
            showToast(`保存成功！会议记录已保存${oplCount > 0 ? '，并添加了 ' + oplCount + ' 个问题项' : ''}`);

            if (currentPage === 'dashboard') renderDashboard();
            else if (currentPage === 'meetings') renderMeetings();
            else if (currentPage === 'opl') renderOPL();
            updateCounts();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML.replace(/"/g, '&quot;');
        }

        // Close modals on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('active');
            });
        });

        // ==================== Init ====================
        loadStore();
        renderDashboard();
    </script>
</body>
</html>
